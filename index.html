<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Umbral">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0F1729">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head><body>
<title>Umbral Coach</title>
<meta name="description" content="Entrenador de ciclismo, running, triatlón y duatlón con nutrición periodizada y fuerza.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root {
  --bg: #EDF0F4; --surface: #FFFFFF; --surface-2: #F5F7FA; --surface-3: #E9EDF3;
  --ink: #0F1729; --ink-2: #384257; --muted: #5E6A7E; --line: #D8DEE7; --line-2: #BDC6D4;
  --primary: #0F1729; --on-primary: #FFFFFF; --focus: #2F74D0;
  --good: #16865A; --good-bg: #E2F3EA; --warn: #9A6400; --warn-bg: #FBF0D9; --bad: #BF2F39; --bad-bg: #FBE5E6;
  --z1: #A2ADBF; --z2: #2F74D0; --z3: #1E9E64; --z4: #D3AC0C; --z5: #E2551E; --z6: #B8216E; --z7: #6446D0; --zs: #7C8799;
  --ph-base: #C5CEDC; --ph-build: #8494AF; --ph-spec: #465775; --ph-taper: #1C2740; --ph-race: #0F1729;
  --ph-base-ink: #0F1729; --ph-build-ink: #0F1729; --ph-spec-ink: #FFFFFF; --ph-taper-ink: #FFFFFF;
  --tip-bg: #0F1729; --tip-ink: #F2F4F8;
  --cho: #B7780C; --pro: #2E68A8; --fat: #5F7A2E;
  --shadow: 0 1px 2px rgba(15, 23, 41, .06), 0 4px 16px rgba(15, 23, 41, .05);
  --f-body: 'Barlow', 'Helvetica Neue', Arial, sans-serif;
  --f-cond: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1120; --surface: #131B2E; --surface-2: #18223A; --surface-3: #1F2A44;
    --ink: #E9EDF5; --ink-2: #C3CBDA; --muted: #95A1B6; --line: #26324C; --line-2: #36445F;
    --primary: #E9EDF5; --on-primary: #0B1120; --focus: #6FA8F5;
    --good: #45C98D; --good-bg: #123325; --warn: #E8B54A; --warn-bg: #33280F; --bad: #F2727A; --bad-bg: #3A1519;
    --z1: #5D6980; --z2: #4E93EA; --z3: #27B374; --z4: #DDB42A; --z5: #F2702E; --z6: #E5479A; --z7: #8F7CF5; --zs: #6D7890;
    --ph-base: #2E3B57; --ph-build: #54668A; --ph-spec: #8C9CBC; --ph-taper: #C9D2E3; --ph-race: #E9EDF5;
    --ph-base-ink: #E9EDF5; --ph-build-ink: #FFFFFF; --ph-spec-ink: #0B1120; --ph-taper-ink: #0B1120;
    --tip-bg: #E9EDF5; --tip-ink: #0B1120;
  --cho: #E6A93A; --pro: #6199D6; --fat: #9BB65E;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1120; --surface: #131B2E; --surface-2: #18223A; --surface-3: #1F2A44;
  --ink: #E9EDF5; --ink-2: #C3CBDA; --muted: #95A1B6; --line: #26324C; --line-2: #36445F;
  --primary: #E9EDF5; --on-primary: #0B1120; --focus: #6FA8F5;
  --good: #45C98D; --good-bg: #123325; --warn: #E8B54A; --warn-bg: #33280F; --bad: #F2727A; --bad-bg: #3A1519;
  --z1: #5D6980; --z2: #4E93EA; --z3: #27B374; --z4: #DDB42A; --z5: #F2702E; --z6: #E5479A; --z7: #8F7CF5; --zs: #6D7890;
  --ph-base: #2E3B57; --ph-build: #54668A; --ph-spec: #8C9CBC; --ph-taper: #C9D2E3; --ph-race: #E9EDF5;
    --ph-base-ink: #E9EDF5; --ph-build-ink: #FFFFFF; --ph-spec-ink: #0B1120; --ph-taper-ink: #0B1120;
  --tip-bg: #E9EDF5; --tip-ink: #0B1120;
  --cho: #E6A93A; --pro: #6199D6; --fat: #9BB65E;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; line-height: 1.15; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.cond { font-family: var(--f-cond); }
.muted { color: var(--muted); }
.eyebrow { font-family: var(--f-cond); font-weight: 600; font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- estructura ---------- */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100%; background: linear-gradient(90deg, var(--surface) 231px, var(--line) 231px 232px, transparent 232px); }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; display: flex; flex-direction: column; gap: 4px; padding: 22px 14px; border-right: 1px solid var(--line); background: var(--surface); }
.brand { display: flex; flex-direction: column; gap: 2px; padding: 0 10px 22px; }
.logo { font-family: var(--f-cond); font-weight: 700; font-size: 30px; letter-spacing: .04em; line-height: 1; position: relative; display: inline-block; }
.logo-line { display: block; height: 3px; margin-top: 5px; width: 100%; background: linear-gradient(90deg, var(--z4) 0 50%, var(--z5) 50% 100%); border-radius: 2px; }
.brand small { font-size: 12px; color: var(--muted); margin-top: 6px; }
.nav-btn { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 0; background: none; border-radius: 8px; color: var(--ink-2); font-weight: 500; text-align: left; }
.nav-btn svg { width: 20px; height: 20px; flex: none; }
.nav-btn:hover { background: var(--surface-2); color: var(--ink); }
.nav-btn[aria-current="page"] { background: var(--surface-3); color: var(--ink); font-weight: 600; }
.rail-foot { margin-top: auto; padding: 12px 10px 0; font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
.sync-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); margin-right: 6px; vertical-align: middle; }
.sync-dot.on { background: var(--good); }

main { padding-inline: 32px; padding-block: 24px 64px; min-width: 0; }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.topbar { display: none; }
.tabbar { display: none; }

@media (max-width: 960px) {
  .app { grid-template-columns: minmax(0, 1fr); background: none; }
  .rail { display: none; }
  main { padding-inline: 16px; padding-block: 12px 104px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); padding: 10px 16px; margin-inline: -16px; border-bottom: 1px solid var(--line); }
  .topbar .logo { font-size: 24px; }
  .topbar .logo-line { height: 2px; margin-top: 3px; }
  .tabbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); justify-content: space-around; }
  .tabbar .nav-btn { flex-direction: column; gap: 2px; padding: 6px 4px; font-size: 11.5px; flex: 1; align-items: center; text-align: center; border-radius: 8px; }
  .tabbar .nav-btn[aria-current="page"] { background: none; color: var(--ink); }
  .tabbar .nav-btn[aria-current="page"] svg { stroke-width: 2.2; }
}
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; width: 36px; height: 36px; display: grid; place-items: center; color: var(--ink-2); }
.icon-btn svg { width: 18px; height: 18px; }

/* ---------- piezas comunes ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
.card.pad-s { padding: 16px; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.card-h h2, .h2 { font-family: var(--f-cond); font-weight: 700; font-size: 22px; letter-spacing: .01em; text-transform: uppercase; }
.h1 { font-family: var(--f-cond); font-weight: 700; font-size: clamp(30px, 4.4vw, 44px); letter-spacing: .005em; text-transform: uppercase; line-height: 1; }
.sub { color: var(--muted); font-size: 14.5px; }
.grid { display: grid; gap: 18px; }
.g-main { grid-template-columns: minmax(0, 1.6fr) minmax(300px, 1fr); align-items: start; }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.stack { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.sb { justify-content: space-between; }
@media (max-width: 1100px) { .g-main { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 760px) { .g-2, .g-3 { grid-template-columns: minmax(0, 1fr); } .card { padding: 16px; } }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 9px; padding: 9px 16px; border: 1px solid var(--primary); background: var(--primary); color: var(--on-primary); font-weight: 600; font-size: 14.5px; line-height: 1.2; }
.btn:hover { filter: brightness(1.12); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-2); }
.btn.ghost:hover { background: var(--surface-2); filter: none; }
.btn.small { padding: 6px 11px; font-size: 13.5px; border-radius: 8px; }
.btn.link { border: 0; background: none; color: var(--ink-2); padding: 4px 2px; text-decoration: underline; text-underline-offset: 3px; font-weight: 500; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13.5px; font-weight: 500; color: var(--ink-2); }
button.chip:hover { border-color: var(--line-2); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 12.5px; font-weight: 600; font-family: var(--f-cond); letter-spacing: .05em; text-transform: uppercase; background: var(--surface-3); color: var(--ink-2); white-space: nowrap; }
.pill.good { background: var(--good-bg); color: var(--good); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.dark { background: var(--primary); color: var(--on-primary); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }

/* banner de ejemplo */
.demo { display: flex; gap: 14px 20px; align-items: center; justify-content: space-between; flex-wrap: wrap; border: 1px dashed var(--line-2); background: var(--surface-2); border-radius: 14px; padding: 14px 18px; }
.demo p { font-size: 14px; color: var(--ink-2); max-width: 60ch; }

/* cabecera de página */
.page-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.page-h .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.countdown { text-align: right; }
.countdown b { font-family: var(--f-cond); font-size: 40px; font-weight: 700; line-height: .9; display: block; }
.countdown span { font-size: 13px; color: var(--muted); }
@media (max-width: 600px) { .countdown { text-align: left; } }

/* ---------- sesión ---------- */
.sess { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.sess-h { display: flex; gap: 14px; align-items: flex-start; padding: 18px 20px 12px; }
.sp-ico { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-3); color: var(--ink); flex: none; }
.sp-ico svg { width: 24px; height: 24px; }
.sess-t { flex: 1; min-width: 0; }
.sess-t h3 { font-family: var(--f-cond); font-weight: 700; font-size: 25px; text-transform: uppercase; letter-spacing: .01em; }
.sess-stats { display: flex; gap: 18px; margin-top: 6px; flex-wrap: wrap; }
.stat { display: flex; flex-direction: column; }
.stat b { font-family: var(--f-cond); font-weight: 600; font-size: 21px; line-height: 1.1; }
.stat span { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-family: var(--f-cond); font-weight: 600; }
.wchart { padding: 0 20px; }
.wchart svg { display: block; width: 100%; height: 96px; }
.wchart .axis { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); padding-top: 4px; font-variant-numeric: tabular-nums; }
.zl { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); padding: 8px 20px 0; }
.zl span { display: inline-flex; align-items: center; gap: 5px; }
.zl i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.steps { list-style: none; margin: 14px 0 0; padding: 0 20px; display: flex; flex-direction: column; }
.steps li { display: grid; grid-template-columns: 4px 104px minmax(0, 1fr) minmax(150px, auto); gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); align-items: start; }
.steps li .zbar { width: 4px; align-self: stretch; border-radius: 2px; }
.steps .dur { font-family: var(--f-cond); font-weight: 600; font-size: 17px; font-variant-numeric: tabular-nums; }
.steps .what { font-size: 14.5px; }
.steps .what small { display: block; color: var(--muted); font-size: 12.5px; }
.steps .tgt { text-align: right; font-variant-numeric: tabular-nums; }
.steps .tgt b { display: block; font-weight: 600; font-size: 14.5px; }
.steps .tgt small { color: var(--muted); font-size: 12px; }
@media (max-width: 640px) { .steps li { grid-template-columns: 4px 76px minmax(0, 1fr); } .steps .tgt { grid-column: 3; text-align: left; } }
.notes { padding: 14px 20px 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--ink-2); }
.notes p { max-width: 75ch; }
.fuel { margin: 14px 20px 0; padding: 12px 14px; border-radius: 10px; background: var(--surface-2); font-size: 14px; display: flex; gap: 10px; }
.fuel svg { width: 18px; height: 18px; flex: none; margin-top: 2px; color: var(--muted); }
.sess-f { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 20px 18px; margin-top: 14px; border-top: 1px solid var(--line); }
.done-badge { display: inline-flex; align-items: center; gap: 8px; color: var(--good); font-weight: 600; }
.rpe { display: flex; gap: 4px; flex-wrap: wrap; }
.rpe button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-variant-numeric: tabular-nums; }
.rpe button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.ex-list { list-style: none; margin: 10px 0 0; padding: 0 20px; }
.ex-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.ex-list .pres { font-family: var(--f-cond); font-weight: 600; font-size: 17px; text-align: right; font-variant-numeric: tabular-nums; }
.ex-list small { color: var(--muted); font-size: 12.5px; }
.sess.dropped { opacity: .6; }
.sess.mini .sess-h { padding: 14px 16px; }
.sess.mini h3 { font-size: 20px; }

/* ---------- estado / check-in ---------- */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 7px 0; width: 38px; font-weight: 600; font-variant-numeric: tabular-nums; border-right: 1px solid var(--line); color: var(--ink-2); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
.seg.wide button { width: auto; padding: 7px 12px; font-size: 13.5px; }
.ck { display: flex; flex-direction: column; gap: 14px; }
.ck-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.ck-row label, .ck-row .lab { font-weight: 500; font-size: 14.5px; }
.ck-row .lab small { display: block; color: var(--muted); font-weight: 400; font-size: 12.5px; }
@media (max-width: 480px) { .ck-row { flex-direction: column; align-items: flex-start; } }
.ready { display: flex; gap: 16px; align-items: center; }
.ring { position: relative; width: 84px; height: 84px; flex: none; }
.ring svg { width: 84px; height: 84px; transform: rotate(-90deg); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-cond); font-weight: 700; font-size: 30px; }
.why { margin: 10px 0 0; padding-left: 18px; font-size: 13.5px; color: var(--ink-2); }

/* ---------- formularios ---------- */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
.field small { color: var(--muted); font-size: 12px; }
input[type="text"], input[type="number"], input[type="date"], select, textarea { width: 100%; border: 1px solid var(--line-2); background: var(--surface); border-radius: 9px; padding: 9px 11px; font-size: 15px; min-height: 40px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--focus); outline-offset: 0; border-color: transparent; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
.fsec { display: flex; flex-direction: column; gap: 14px; padding-block: 18px; border-top: 1px solid var(--line); }
.fsec:first-child { border-top: 0; padding-top: 0; }
.fsec h3 { font-family: var(--f-cond); font-size: 18px; text-transform: uppercase; letter-spacing: .03em; }
.days { display: flex; gap: 6px; flex-wrap: wrap; }
.days button { width: 42px; height: 40px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--surface); font-weight: 600; }
.days button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.est { font-size: 11px; font-weight: 600; color: var(--warn); background: var(--warn-bg); border-radius: 4px; padding: 1px 6px; margin-left: 6px; font-family: var(--f-cond); letter-spacing: .05em; text-transform: uppercase; }

/* ---------- tablas ---------- */
.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.tbl th { text-align: left; font-family: var(--f-cond); font-weight: 600; font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.r, .tbl th.r { text-align: right; }
.zsw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 8px; vertical-align: -1px; }

/* ---------- plan ---------- */
.phasebar { display: flex; gap: 2px; height: 34px; border-radius: 8px; overflow: hidden; }
.phasebar div { display: flex; align-items: center; justify-content: center; font-family: var(--f-cond); font-weight: 600; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; min-width: 0; overflow: hidden; white-space: nowrap; padding: 0 4px; }
.ph-base { background: var(--ph-base); color: var(--ph-base-ink); }
.ph-build { background: var(--ph-build); color: var(--ph-build-ink); }
.ph-spec { background: var(--ph-spec); color: var(--ph-spec-ink); }
.ph-taper, .ph-race { background: var(--ph-taper); color: var(--ph-taper-ink); }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--f-body); font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.legend i.sq { width: 10px; height: 10px; }
.weeknav { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.weeknav .ttl { text-align: center; flex: 1; min-width: 180px; }
.day { display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); }
.day:first-child { border-top: 0; }
.day-d b { display: block; font-family: var(--f-cond); font-size: 19px; font-weight: 700; text-transform: uppercase; line-height: 1.1; }
.day-d span { font-size: 13px; color: var(--muted); }
.day.today .day-d span::after { content: 'hoy'; margin-left: 6px; font-size: 11px; background: var(--primary); color: var(--on-primary); padding: 1px 6px; border-radius: 4px; vertical-align: 1px; letter-spacing: .06em; }
.day.past { opacity: .72; }
.srow { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 12px; }
.srow + .srow { margin-top: 6px; }
button.srow:hover { border-color: var(--line-2); }
.srow .ic { width: 20px; height: 20px; flex: none; color: var(--ink-2); }
.srow .t { flex: 1; min-width: 0; font-weight: 500; }
.srow .t small { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; }
.srow .m { font-variant-numeric: tabular-nums; font-size: 13.5px; color: var(--ink-2); white-space: nowrap; text-align: right; }
.srow.hard { border-left: 3px solid var(--ink); }
.srow.done .t { text-decoration: line-through; text-decoration-color: var(--line-2); }
.srow.drop { opacity: .55; }
.day-acts { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
.day-rest { color: var(--muted); font-size: 14px; padding: 6px 0; }
@media (max-width: 560px) { .day { grid-template-columns: minmax(0, 1fr); gap: 8px; } }
.expanded { margin-top: 8px; }

/* semana compacta (hoy) */
.wstrip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.wstrip button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 76px; }
.wstrip button.today { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
.wstrip .dl { font-family: var(--f-cond); font-weight: 700; font-size: 14px; }
.wstrip .ics { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; }
.wstrip .ics svg { width: 15px; height: 15px; color: var(--ink-2); }
.wstrip .tss { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- nutrición ---------- */
.macro { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.macro div { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.macro b { display: block; font-family: var(--f-cond); font-size: 30px; font-weight: 700; line-height: 1; }
.macro span { font-size: 12.5px; color: var(--muted); }
.macro em { font-style: normal; font-weight: 600; color: var(--ink-2); }
@media (max-width: 560px) { .macro { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.dayk { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; align-items: end; }
.dayk button { border: 1px solid transparent; background: none; border-radius: 10px; padding: 6px 2px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.dayk button[aria-pressed="true"] { border-color: var(--line-2); background: var(--surface-2); }
.dayk .bar { width: 22px; max-width: 70%; background: var(--z2); border-radius: 4px 4px 0 0; }
.dayk .v { font-family: var(--f-cond); font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; }
.dayk .d { font-size: 12px; color: var(--muted); }
.meals { display: flex; flex-direction: column; }
.meal { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); }
.meal:first-child { border-top: 0; }
.meal .tm { font-family: var(--f-cond); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.meal h4 { font-size: 15.5px; font-weight: 600; }
.meal .tg { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meal ul { margin: 8px 0 0; padding-left: 18px; font-size: 14px; color: var(--ink-2); }
.meal.dur { background: var(--surface-2); border-radius: 10px; padding: 12px; border-top: 0; margin: 4px 0; }
.alert { border-radius: 10px; padding: 12px 14px; font-size: 14px; }
.alert.warn { background: var(--warn-bg); color: var(--ink); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); }
.alert.info { background: var(--surface-2); border: 1px solid var(--line); }
.kv { display: grid; grid-template-columns: minmax(120px, 190px) minmax(0, 1fr); gap: 8px 16px; font-size: 14.5px; }
.kv dt { color: var(--muted); font-weight: 500; }
.kv dd { margin: 0; }
@media (max-width: 560px) { .kv { grid-template-columns: minmax(0, 1fr); gap: 2px; } .kv dd { margin-bottom: 8px; } }

/* ---------- fuerza ---------- */
.exc { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
.exc h4 { font-size: 15.5px; font-weight: 600; }
.exc ul { margin: 0; padding-left: 18px; font-size: 13.5px; color: var(--ink-2); }
.exc .tags { display: flex; gap: 6px; flex-wrap: wrap; }
.exc .rp { font-size: 12.5px; color: var(--muted); }
.lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
details.cues summary { cursor: pointer; font-size: 13px; color: var(--ink-2); list-style: none; }
details.cues summary::-webkit-details-marker { display: none; }
details.cues summary::before { content: '+ '; font-weight: 700; }
details.cues[open] summary::before { content: '– '; }

/* ---------- coach ---------- */
.chat { display: flex; flex-direction: column; min-height: 60vh; }
.msgs { display: flex; flex-direction: column; gap: 12px; padding-bottom: 14px; }
.msg { max-width: 78ch; padding: 12px 15px; border-radius: 14px; font-size: 15px; line-height: 1.5; }
.msg.u { align-self: flex-end; background: var(--primary); color: var(--on-primary); border-bottom-right-radius: 4px; max-width: 70%; }
.msg.a { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg.a p + p, .msg.a ul { margin-top: 8px; }
.msg.a ul { padding-left: 18px; margin-bottom: 0; }
.msg .acts { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.composer { position: sticky; bottom: 0; background: var(--surface); padding-top: 10px; display: flex; flex-direction: column; gap: 10px; }
@media (max-width: 960px) { .composer { bottom: calc(64px + env(safe-area-inset-bottom, 0px)); } }
.composer form { display: flex; gap: 8px; }
.composer textarea { resize: none; min-height: 46px; max-height: 160px; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }
.thinking { color: var(--muted); font-style: italic; }

/* ---------- tooltip ---------- */
#tip { position: fixed; z-index: 100; pointer-events: none; background: var(--tip-bg); color: var(--tip-ink); font-size: 12.5px; padding: 6px 9px; border-radius: 6px; max-width: 260px; line-height: 1.35; box-shadow: var(--shadow); font-variant-numeric: tabular-nums; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 90; background: var(--tip-bg); color: var(--tip-ink); padding: 10px 16px; border-radius: 10px; font-size: 14px; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
@media (max-width: 960px) { .toast { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); } }
.foot-note { font-size: 12.5px; color: var(--muted); max-width: 90ch; }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

/* ---------- pruebas ---------- */
.prio { display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 6px; font-family: var(--f-cond); font-weight: 700; font-size: 14px; line-height: 1; vertical-align: middle; }
.prio-A { background: var(--primary); color: var(--on-primary); }
.prio-B { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
.prio-C { background: var(--surface-3); color: var(--ink-2); }
.race-t { font-family: var(--f-cond); font-weight: 700; font-size: 26px; text-transform: uppercase; margin-top: 8px; }
.legend i.mk { width: 10px; height: 10px; border-radius: 50%; }
.legend i.mk-A { background: var(--ink); }
.legend i.mk-B { background: var(--surface); box-shadow: inset 0 0 0 2px var(--ink); }
.legend i.mk-C { width: 7px; height: 7px; background: var(--muted); }
@media (max-width: 960px) { .tabbar .nav-btn { font-size: 10.5px; padding: 6px 2px; } .tabbar .nav-btn svg { width: 19px; height: 19px; } }

/* preferencias por día */
.prefs { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.pref-row { display: grid; grid-template-columns: 92px 168px minmax(0, 1fr); gap: 8px 12px; align-items: start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.pref-row.st-warn { border-color: color-mix(in srgb, var(--warn) 50%, var(--line)); }
.pref-row.st-bad { border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); }
.pref-d { font-weight: 700; font-size: 14.5px; padding-top: 9px; display: flex; flex-direction: column; gap: 1px; }
.pref-d small { font-weight: 600; font-size: 11px; color: var(--muted); font-family: var(--f-cond); text-transform: uppercase; letter-spacing: .05em; }
.pref-row select { min-height: 40px; width: 100%; }
.pref-adv { font-size: 13.5px; line-height: 1.45; color: var(--ink-2); padding-top: 3px; }
.pref-adv .btn.link { padding: 0 2px; font-size: 13.5px; }
.adv { display: inline-block; font-family: var(--f-cond); font-weight: 600; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; padding: 1px 8px; border-radius: 99px; margin-right: 8px; vertical-align: 1px; }
.adv-ok { background: var(--good-bg); color: var(--good); }
.adv-warn { background: var(--warn-bg); color: var(--warn); }
.adv-bad { background: var(--bad-bg); color: var(--bad); }
.adv-auto { background: var(--surface-2); color: var(--muted); }
@media (max-width: 640px) {
  .pref-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); }
  .pref-d { padding-top: 8px; }
  .pref-adv { grid-column: 1 / -1; padding-top: 0; }
}

/* ---------- nutrición (estilo Combustible) ---------- */
.nx { display: flex; flex-direction: column; gap: 14px; margin-top: 18px; }
.nx-seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); max-width: 560px; }
.nx-seg button { flex: 1; border: 0; background: none; padding: 9px 6px; font-weight: 600; font-size: 14px; color: var(--muted); min-height: 42px; }
.nx-seg button + button { border-left: 1px solid var(--line); }
.nx-seg button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
.nx-seg-s { margin: 10px 0; }
.nx-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 1100px) { .nx-grid { grid-template-columns: minmax(0, 1fr); } }
.nx-col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

.nx-date::first-letter { text-transform: uppercase; }
.nx-arrow { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 20px; line-height: 1; }

.nx-hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 8px; }
.nx-kcal { font-family: var(--f-cond); font-weight: 700; font-size: 64px; line-height: .9; letter-spacing: -.01em; }
.nx-kcal small { font-size: 18px; font-weight: 500; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.nx-bib { border: 2px solid var(--ink); border-radius: 6px; padding: 4px 10px 3px; text-align: center; background: var(--surface); min-width: 96px; }
.nx-bib .t { font-family: var(--f-cond); font-weight: 700; font-size: 22px; line-height: 1; }
.nx-bib .s { font-size: 12px; color: var(--muted); }
.nx-sub { font-size: 14px; color: var(--ink-2); }
.nx-gate { padding: 10px 12px; border-left: 3px solid var(--warn); background: var(--surface); font-size: 14px; border-radius: 0 8px 8px 0; }
.nx-gate.bad { border-left-color: var(--bad); }
.nx-gate.info { border-left-color: var(--line-2); }
.nx-gate.good { border-left-color: var(--good); }
.nx-macros { display: grid; gap: 9px; }
.nx-mac .lbl { display: flex; justify-content: space-between; font-size: 14px; }
.nx-mac .lbl b { font-family: var(--f-cond); font-size: 17px; font-weight: 600; }
.nx-bar { height: 8px; background: var(--surface-3); border-radius: 4px; overflow: hidden; margin-top: 3px; }
.nx-bar i { display: block; height: 100%; border-radius: 4px; }
.nx-over { color: var(--bad); font-weight: 600; }
.nx-profile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px 4px; }
.nx-profile svg { display: block; width: 100%; height: auto; }
.nx-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); padding: 2px 8px 6px; }
.nx-legend span::before { content: ""; display: inline-block; width: 14px; height: 3px; margin-right: 5px; vertical-align: middle; background: var(--cho); }
.nx-legend .tgt::before { background: none; border-top: 2px dashed var(--muted); }
.nx-legend .trn::before { height: 8px; background: var(--pro); opacity: .3; }
.nx-legend .goal::before { background: none; border-top: 2px dashed var(--good); }
.nx-block { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.nx-h2 { font-family: var(--f-cond); font-weight: 600; font-size: 22px; letter-spacing: .01em; margin-top: 4px; }
.nx-h3 { font-family: var(--f-cond); font-weight: 600; font-size: 19px; margin-bottom: 4px; }
.nx-small { font-size: 13.5px; }
.nx-wk { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.nx-wk button { display: flex; flex-direction: column; align-items: center; gap: 3px; border: 1px solid transparent; background: none; border-radius: 8px; padding: 4px 0; min-height: 44px; }
.nx-wk button[aria-pressed="true"] { border-color: var(--ink); background: var(--surface-2); }
.nx-wk .k { font-family: var(--f-cond); font-size: 14px; font-weight: 600; }
.nx-wk .b { position: relative; width: 18px; height: 64px; background: var(--surface-3); border-radius: 4px; display: flex; align-items: flex-end; overflow: hidden; }
.nx-wk .b i { display: block; width: 100%; background: var(--line-2); border-radius: 4px; }
.nx-wk .b em { position: absolute; left: -2px; right: -2px; height: 2px; background: var(--ink); }
.nx-wk .d { font-size: 12px; color: var(--muted); }
.nx-key { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; }
.nx-key.def { background: var(--pro); } .nx-key.load { background: var(--cho); }
.nx-block p.nx-small { margin-top: 8px; color: var(--ink-2); }
.nx-ses { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.nx-ses:first-of-type { border-top: 0; }
.nx-ses .ic { width: 36px; height: 36px; border-radius: 50%; background: var(--surface-3); display: grid; place-items: center; }
.nx-ses .ic svg { width: 18px; height: 18px; }
.nx-meal { padding: 10px 0; border-top: 1px solid var(--line); }
.nx-meal:first-child { border-top: 0; padding-top: 2px; }
.nx-meal .meal-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.nx-meal .meal-h h3 { font-family: var(--f-cond); font-weight: 600; font-size: 19px; }
.nx-meal .tg { font-size: 13px; color: var(--muted); text-align: right; white-space: nowrap; }
.nx-rings { display: flex; gap: 10px; margin: 8px 0 6px; flex-wrap: wrap; }
.nx-ring { text-align: center; min-width: 72px; }
.nx-ring svg { display: block; margin: 0 auto; }
.nx-ring .v { font-family: var(--f-cond); font-weight: 600; font-size: 13px; margin-top: 2px; }
.nx-ring .l { font-size: 11px; color: var(--muted); }
.nx-ring .ok { color: var(--good); } .nx-ring .over { color: var(--bad); }
.nx-grp { font-size: 12.5px; color: var(--muted); margin-top: 6px; font-family: var(--f-cond); letter-spacing: .04em; text-transform: uppercase; }
.nx-irow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); }
.nx-iname { background: none; border: 0; text-align: left; font-size: 15px; padding: 0; color: var(--ink); min-height: 32px; }
.nx-iqty { display: flex; align-items: center; gap: 6px; }
.nx-iqty button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 17px; line-height: 1; padding: 0; }
.nx-iqty input { width: 68px; padding: 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); text-align: right; font-size: 15px; }
.nx-ik { font-size: 12px; color: var(--muted); }
.nx-idel { justify-self: end; font-size: 12.5px; color: var(--muted); background: none; border: 0; padding: 4px 0; text-decoration: underline; text-underline-offset: 2px; }
.nx-sug { margin-top: 6px; padding: 8px 10px; background: var(--surface-2); border-radius: 8px; font-size: 14px; }
.nx-warn { color: var(--bad); font-weight: 700; }
.nx-soft { color: var(--warn); }
.nx-adapt { color: var(--ink-2); }
.nx-softtxt { color: var(--warn); }
.nx-rec { padding: 12px 0; border-top: 1px solid var(--line); }
.nx-rec:first-child { border-top: 0; padding-top: 2px; }
.nx-rec h3 { font-family: var(--f-cond); font-weight: 600; font-size: 19px; }
.nx-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; max-width: 720px; }
.nx-stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.nx-stat b { display: block; font-family: var(--f-cond); font-size: 28px; font-weight: 600; line-height: 1.05; }
.nx-stat span { font-size: 12px; color: var(--muted); }
.nx-tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.nx-tbl th, .nx-tbl td { text-align: left; padding: 7px 4px; border-top: 1px solid var(--line); }
.nx-tbl th { font-weight: 600; color: var(--muted); font-size: 13px; border-top: 0; }
.nx-tbl .r { text-align: right; }
.nx-fab { position: fixed; right: 28px; bottom: 28px; width: 60px; height: 60px; border-radius: 50%; background: var(--cho); color: #1A1204; border: 0; font-size: 32px; font-weight: 500; line-height: 1; box-shadow: 0 4px 14px rgba(0, 0, 0, .22); z-index: 25; }
@media (max-width: 960px) { .nx-fab { right: 16px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); } }
.nx-scrim { position: fixed; inset: 0; background: rgba(10, 15, 25, .5); z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
.nx-sheet { position: relative; background: var(--bg); width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; border-radius: 16px 16px 0 0; padding: 14px 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 961px) { .nx-scrim { align-items: center; } .nx-sheet { border-radius: 16px; max-height: 88vh; } .nx-grab { display: none; } }
.nx-grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line-2); margin: 0 auto 10px; }
.nx-x { position: absolute; right: 10px; top: 8px; width: 40px; height: 40px; border: 0; background: none; font-size: 26px; color: var(--muted); }
label.nx-f, p.nx-f { display: block; font-size: 13.5px; color: var(--muted); margin: 10px 0 4px; }
.nx-t { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 16px; }
.nx-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.nx-grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.nx-list { max-height: 46vh; overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); margin-top: 8px; }
.nx-li { display: flex; justify-content: space-between; gap: 8px; padding: 11px 12px; border: 0; border-top: 1px solid var(--line); width: 100%; background: none; text-align: left; font-size: 15px; }

<script>
/* ===================== UMBRAL · motor de entrenamiento y nutrición ===================== */
(function (root) {
'use strict';
const E = {};

/* ---------- utilidades ---------- */
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const r5 = x => Math.max(5, Math.round(x / 5) * 5);
const pad = n => String(n).padStart(2, '0');
function parseD(s) { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d, 12)); }
function fmtD(dt) { return dt.toISOString().slice(0, 10); }
function addDays(s, n) { const d = parseD(s); d.setUTCDate(d.getUTCDate() + n); return fmtD(d); }
function dow(s) { return (parseD(s).getUTCDay() + 6) % 7; }            // 0 = lunes
function mondayOf(s) { return addDays(s, -dow(s)); }
function diffDays(a, b) { return Math.round((parseD(b) - parseD(a)) / 86400000); }
function fmtPace(sec) { sec = Math.round(sec); return Math.floor(sec / 60) + ':' + pad(sec % 60); }
function fmtMin(min) {
  min = Math.round(min * 10) / 10;
  if (min < 1) return Math.round(min * 60) + '″';
  if (min % 1) { const s = Math.round((min % 1) * 60); return Math.floor(min) + '′' + pad(s) + '″'; }

  const h = Math.floor(min / 60), m = Math.round(min % 60);

}
function fmtHM(min) { min = Math.round(min); return Math.floor(min / 60) + ':' + pad(min % 60); }
function parseClock(str) { // "mm:ss" o "h:mm:ss" → segundos
  if (str == null || str === '') return null;
  const parts = String(str).trim().split(':').map(Number);
  if (parts.some(isNaN)) return null;
  return parts.reduce((a, b) => a * 60 + b, 0);
}
function todayStr() { const n = new Date(); return n.getFullYear() + '-' + pad(n.getMonth() + 1) + '-' + pad(n.getDate()); }
Object.assign(E, { clamp, parseD, fmtD, addDays, dow, mondayOf, diffDays, fmtPace, fmtMin, fmtHM, parseClock, todayStr });

E.DIAS = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
E.DIAS_C = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];
E.MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
E.fmtFecha = s => { const d = parseD(s); return E.DIAS[dow(s)].toLowerCase() + ' ' + d.getUTCDate() + ' ' + E.MESES[d.getUTCMonth()]; };
E.fmtFechaC = s => { const d = parseD(s); return d.getUTCDate() + ' ' + E.MESES[d.getUTCMonth()]; };

/* ---------- VDOT (Daniels & Gilbert) ---------- */
const vo2AtV = v => -4.60 + 0.182258 * v + 0.000104 * v * v;                        // v en m/min
const pctMax = t => 0.8 + 0.1894393 * Math.exp(-0.012778 * t) + 0.2989558 * Math.exp(-0.1932605 * t);
function vdotFromRace(distM, tSec) { const t = tSec / 60; return vo2AtV(distM / t) / pctMax(t); }
function vAtVO2(vo2) { const a = 0.000104, b = 0.182258, c = -4.60 - vo2; return (-b + Math.sqrt(b * b - 4 * a * c)) / (2 * a); }
function paceAtFrac(vdot, f) { return 60000 / vAtVO2(vdot * f); }                      // s/km
function predictRace(vdot, distM) {
  let lo = distM / 450, hi = distM / 60;
  for (let i = 0; i < 70; i++) { const mid = (lo + hi) / 2; if (vdotFromRace(distM, mid * 60) > vdot) lo = mid; else hi = mid; }
  return (lo + hi) / 2 * 60;                                                             // s
}
E.vdotFromRace = vdotFromRace; E.predictRace = predictRace;

/* ---------- pruebas objetivo ---------- */
E.PLAN_DISC = { ciclismo: 'Ciclismo', running: 'Running', triatlon: 'Triatlón', duatlon: 'Duatlón' };
E.DISC = Object.assign({}, E.PLAN_DISC, { natacion: 'Natación' });
E.EVENTS = {
  ciclismo: {
    granfondo: { n: 'Marcha cicloturista / gran fondo', h: [7, 5.5, 4.5], taper: 2, bikeIF: [0.70, 0.78], longMax: 330 },
    carrera: { n: 'Carrera en ruta', h: [3.6, 3.1, 2.8], taper: 2, bikeIF: [0.75, 0.85], longMax: 270 },
    mtb: { n: 'MTB / gravel maratón', h: [6, 5, 4.2], taper: 2, bikeIF: [0.75, 0.82], longMax: 300 },
    xc: { n: 'XC, criterium o contrarreloj', h: [1.6, 1.3, 1.1], taper: 1, bikeIF: [0.95, 1.02], longMax: 180 }
  },
  running: {
    k5: { n: '5 km', dist: 5000, taper: 1, longMax: 80 },
    k10: { n: '10 km', dist: 10000, taper: 1, longMax: 95 },
    media: { n: 'Media maratón', dist: 21097.5, taper: 2, longMax: 120 },
    maraton: { n: 'Maratón', dist: 42195, taper: 3, longMax: 160 }
  },
  triatlon: {
    sprint: { n: 'Sprint (750 m · 20 km · 5 km)', legs: [750, 20000, 5000], h: [1.6, 1.3, 1.1], taper: 1, bikeIF: [0.92, 1.0], run: 'TS', longBike: 120, longRun: 60, swimOff: 1, cda: 0.30 },
    olimpico: { n: 'Olímpico (1,5 km · 40 km · 10 km)', legs: [1500, 40000, 10000], h: [3.2, 2.7, 2.3], taper: 2, bikeIF: [0.85, 0.92], run: 'TO', longBike: 180, longRun: 80, swimOff: 2, cda: 0.30 },
    medio: { n: 'Medio / 70.3 (1,9 km · 90 km · 21,1 km)', legs: [1900, 90000, 21097], h: [7, 5.8, 4.9], taper: 2, bikeIF: [0.75, 0.82], run: 'TM', longBike: 240, longRun: 110, swimOff: 4, cda: 0.30 },
    ironman: { n: 'Ironman (3,8 km · 180 km · 42,2 km)', legs: [3800, 180000, 42195], h: [15, 12.5, 10.5], taper: 3, bikeIF: [0.68, 0.75], run: 'TIM', longBike: 330, longRun: 150, swimOff: 5, cda: 0.30 }
  },
  duatlon: {
    sprint: { n: 'Sprint (5 km · 20 km · 2,5 km)', legs: [5000, 20000, 2500], h: [1.45, 1.2, 1.05], taper: 1, bikeIF: [0.90, 0.97], run: 'K5', longBike: 120, longRun: 60, cda: 0.33 },
    estandar: { n: 'Estándar (10 km · 40 km · 5 km)', legs: [10000, 40000, 5000], h: [2.8, 2.3, 2.0], taper: 2, bikeIF: [0.85, 0.90], run: 'K10', longBike: 180, longRun: 80, cda: 0.33 },
    larga: { n: 'Larga (10 km · 60 km · 10 km)', legs: [10000, 60000, 10000], h: [3.9, 3.3, 2.9], taper: 2, bikeIF: [0.78, 0.85], run: 'K10L', longBike: 210, longRun: 95, cda: 0.33 }
  },
  natacion: {
    p400: { n: '400 m (piscina)', dist: 400, taper: 1, longMax: 3000, off: -3 },
    milla: { n: '1.500 m / milla (aguas abiertas)', dist: 1500, taper: 1, longMax: 3500, off: 0 },
    medio: { n: '3.000 m (aguas abiertas)', dist: 3000, taper: 2, longMax: 4000, off: 2 },
    largo: { n: '5.000 m (aguas abiertas)', dist: 5000, taper: 2, longMax: 4500, off: 3 },
    maraton: { n: '10.000 m (maratón acuático)', dist: 10000, taper: 3, longMax: 5000, off: 5 }
  }
};
const LVL = { principiante: 0, intermedio: 1, avanzado: 2 };
E.event = p => p.raceObj ? E.raceEvent(p.raceObj) : E.EVENTS[p.disciplina][p.prueba];

/* ---------- métricas y zonas ---------- */
E.metrics = function (p) {
  const m = { est: {} };
  const lv = LVL[p.nivel] ?? 1;
  m.fcmax = +p.fcmax || Math.round(208 - 0.7 * p.edad); if (!+p.fcmax) m.est.fcmax = true;
  m.lthrRun = +p.lthrRun || Math.round(m.fcmax * 0.89); if (!+p.lthrRun) m.est.lthrRun = true;
  m.lthrBike = +p.lthrBike || (+p.lthrRun ? +p.lthrRun - 6 : Math.round(m.fcmax * 0.86)); if (!+p.lthrBike) m.est.lthrBike = true;
  m.ftp = +p.ftp || Math.round(p.peso * [2.3, 3.0, 3.7][lv] / 5) * 5; if (!+p.ftp) m.est.ftp = true;
  const tMarca = parseClock(p.marcaTiempo);
  if (+p.marcaDist && tMarca) m.vdot = vdotFromRace(+p.marcaDist, tMarca);
  else { m.vdot = [36, 44, 52][lv]; m.est.vdot = true; }
  const v = m.vdot;
  m.pace = {
    REC: paceAtFrac(v, 0.62) + 20, E: paceAtFrac(v, 0.66), Elo: paceAtFrac(v, 0.62), Ehi: paceAtFrac(v, 0.70),
    M: paceAtFrac(v, 0.82), T: paceAtFrac(v, 0.88), I: paceAtFrac(v, 0.975), R: paceAtFrac(v, 1.05)
  };
  m.pred = { K5: predictRace(v, 5000), K10: predictRace(v, 10000), HM: predictRace(v, 21097.5), MAR: predictRace(v, 42195) };
  m.pace.K5 = m.pred.K5 / 5; m.pace.K10 = m.pred.K10 / 10; m.pace.HM = m.pred.HM / 21.0975; m.pace.MAR = m.pred.MAR / 42.195;
  m.pace.K10L = m.pace.K10 * 1.02; m.pace.HILL = m.pace.I;
  m.pace.TS = m.pace.K5 * 1.03; m.pace.TO = m.pace.K10 * 1.04; m.pace.TM = m.pace.HM * 1.08; m.pace.TIM = m.pace.M * 1.12;
  const cssIn = parseClock(p.css);
  m.css = cssIn || [135, 110, 95][lv]; if (!cssIn) m.est.css = true;
  m.wkg = m.ftp / p.peso;
  return m;
};

E.bikeZones = m => [
  ['Z1', 'Recuperación activa', 0, 0.55], ['Z2', 'Resistencia', 0.56, 0.75], ['Z3', 'Tempo', 0.76, 0.90],
  ['SS', 'Sweet spot', 0.88, 0.94], ['Z4', 'Umbral', 0.91, 1.05], ['Z5', 'VO2máx', 1.06, 1.20],
  ['Z6', 'Capacidad anaeróbica', 1.21, 1.50], ['Z7', 'Neuromuscular', 1.51, null]
].map(([z, n, lo, hi]) => ({ z, n, lo, hi, w: [Math.round(lo * m.ftp), hi ? Math.round(hi * m.ftp) : null] }))
  .map((z, i, a) => { if (i > 0 && z.z !== 'SS') { const prev = a[i - 1].z === 'SS' ? a[i - 2] : a[i - 1]; z.w[0] = Math.round((prev.hi || 0) * m.ftp) + 1; } return z; });
E.hrZonesBike = m => [['Z1', 'Recuperación', 0, 0.80], ['Z2', 'Aeróbico', 0.81, 0.89], ['Z3', 'Tempo', 0.90, 0.93], ['Z4', 'Subumbral', 0.94, 0.99], ['Z5a', 'Supraumbral', 1.0, 1.02], ['Z5b', 'Capacidad aeróbica', 1.03, 1.06], ['Z5c', 'Anaeróbico', 1.07, null]]
  .map(([z, n, lo, hi]) => ({ z, n, b: [Math.round(lo * m.lthrBike), hi ? Math.round(hi * m.lthrBike) : m.fcmax] })).map((z, i, a) => { if (i) z.b[0] = a[i - 1].b[1] + 1; return z; });
E.hrZonesRun = m => [['Z1', 'Recuperación', 0, 0.84], ['Z2', 'Aeróbico', 0.85, 0.89], ['Z3', 'Tempo', 0.90, 0.94], ['Z4', 'Subumbral', 0.95, 0.99], ['Z5a', 'Supraumbral', 1.0, 1.02], ['Z5b', 'Capacidad aeróbica', 1.03, 1.06], ['Z5c', 'Anaeróbico', 1.07, null]]
  .map(([z, n, lo, hi]) => ({ z, n, b: [Math.round(lo * m.lthrRun), hi ? Math.round(hi * m.lthrRun) : m.fcmax] })).map((z, i, a) => { if (i) z.b[0] = a[i - 1].b[1] + 1; return z; });
E.runPaces = m => [
  ['E', 'Fácil / rodaje', fmtPace(m.pace.Ehi) + '–' + fmtPace(m.pace.Elo), 'Base aeróbica, tiradas largas. Conversación fluida.'],
  ['M', 'Ritmo maratón', fmtPace(m.pace.M), 'Resistencia específica de maratón.'],
  ['T', 'Umbral', fmtPace(m.pace.T), '≈ ritmo que aguantas 1 hora. Máx. ~10 % del volumen semanal.'],
  ['I', 'Intervalos (VO2máx)', fmtPace(m.pace.I), 'Series de 3–5 min. Máx. ~8 % del volumen semanal.'],
  ['R', 'Repeticiones', fmtPace(m.pace.R), 'Velocidad y economía: 200–400 m con recuperación completa.']
];
E.swimZones = m => [
  ['Z1', 'Recuperación / técnica', '+12″ o más'], ['Z2', 'Aeróbico', '+5″ a +10″'], ['Z3', 'Tempo', '+2″ a +4″'],
  ['Z4', 'Umbral (CSS)', '±1″'], ['Z5', 'VO2máx', '−3″ a −6″']
].map(([z, n, off]) => ({ z, n, off }));

/* intensidad → zona (0..6) para color y altura */
const ZH = [0.5, 0.68, 0.83, 0.98, 1.12, 1.3, 1.5];
function bikeZoneIdx(f) { return f < 0.56 ? 0 : f < 0.76 ? 1 : f < 0.905 ? 2 : f < 1.055 ? 3 : f < 1.205 ? 4 : f < 1.505 ? 5 : 6; }
const RUNZ = { RACE: 3, REC: 0, E: 1, M: 2, TIM: 1, TM: 2, TO: 3, TS: 3, HM: 2, K10L: 3, K10: 3, T: 3, K5: 4, I: 4, HILL: 4, R: 5 };
function swimZoneIdx(off, it) { if (it.drill) return 0; if (it.kick) return 1; return off >= 12 ? 0 : off >= 5 ? 1 : off >= 2 ? 2 : off >= -1 ? 3 : off >= -6 ? 4 : 5; }

/* ---------- ítems de intensidad ---------- */
function itemInfo(it, m) {
  if (it.sp === 'bike') {
    const f = (it.lo + it.hi) / 2, z = bikeZoneIdx(f);
    return { min: it.min, f, z, h: f, tss: it.min / 60 * f * f * 100 };
  }
  if (it.sp === 'run') {
    const pace = it.pace === 'E' ? m.pace.E : m.pace[it.pace];
    const f = m.pace.T / pace, z = RUNZ[it.pace] ?? 1;
    const min = it.km ? it.km * pace / 60 : it.min;
    return { min, f, z, h: ZH[z], tss: min / 60 * f * f * 100, km: min * 60 / pace / 1000 };
  }
  if (it.sp === 'swim') {
    const pace = m.css + it.off, min = it.m / 100 * pace / 60;
    const f = m.css / pace, z = swimZoneIdx(it.off, it);
    return { min, f, z, h: ZH[z], tss: min / 60 * f * f * f * 100, m: it.m, restMin: (it.rst || 0) / 60 };
  }
  return { min: it.min, f: 0.6, z: 1, h: 0.6, tss: it.min * 0.5 };
}
E.itemInfo = itemInfo;

/* objetivo legible para un ítem */
function hrBikeFor(f, m) {
  const pr = f < 0.56 ? [0, 0.80] : f < 0.76 ? [0.81, 0.89] : f < 0.905 ? [0.90, 0.93] : f < 1.055 ? [0.94, 1.0] : [1.0, 1.06];
  if (f >= 1.12) return 'FC no fiable en series cortas';
  return (pr[0] ? Math.round(pr[0] * m.lthrBike) + '–' : '< ') + Math.round(pr[1] * m.lthrBike) + ' ppm';
}
const HRRUN = { RACE: [0.93, 1.0], REC: [0, 0.84], E: [0.80, 0.89], TIM: [0.83, 0.89], TM: [0.88, 0.93], TO: [0.95, 0.99], TS: null, M: [0.88, 0.93], HM: [0.92, 0.96], K10L: [0.95, 0.99], K10: [0.97, 1.01], T: [0.95, 1.0], K5: null, I: null, HILL: null, R: null };
function targetOf(it, m) {
  if (it.sp === 'bike') {
    const f = (it.lo + it.hi) / 2;
    const w = it.lo === it.hi ? Math.round(it.lo * m.ftp) + ' W' : Math.round(it.lo * m.ftp) + '–' + Math.round(it.hi * m.ftp) + ' W';
    const pct = it.lo === it.hi ? Math.round(it.lo * 100) + ' %' : Math.round(it.lo * 100) + '–' + Math.round(it.hi * 100) + ' %';
    return { main: it.max ? 'Máximo' : w, sub: (it.max ? '' : pct + ' FTP · ') + hrBikeFor(f, m) };
  }
  if (it.sp === 'run') {
    let main;
    if (it.pace === 'E') main = fmtPace(m.pace.Ehi) + '–' + fmtPace(m.pace.Elo) + ' /km';
    else if (it.pace === 'REC') main = 'más lento de ' + fmtPace(m.pace.Elo) + ' /km';
    else if (it.pace === 'HILL') main = 'Esfuerzo de series (≈' + fmtPace(m.pace.I) + ' en llano)';
    else main = fmtPace(m.pace[it.pace] - 2) + '–' + fmtPace(m.pace[it.pace] + 2) + ' /km';
    const hr = HRRUN[it.pace];
    const names = { RACE: 'Ritmo objetivo', REC: 'Regenerativo', E: 'Fácil (E)', M: 'Ritmo maratón', TIM: 'Ritmo Ironman', TM: 'Ritmo 70.3', TO: 'Ritmo olímpico', TS: 'Ritmo sprint', HM: 'Ritmo media', K10: 'Ritmo 10 km', K10L: 'Ritmo de carrera', T: 'Umbral (T)', K5: 'Ritmo 5 km', I: 'Intervalos (I)', HILL: 'Cuesta 6–8 %', R: 'Repeticiones (R)' };
    return { main, sub: names[it.pace] + (hr ? ' · ' + (hr[0] ? Math.round(hr[0] * m.lthrRun) + '–' : '< ') + Math.round(hr[1] * m.lthrRun) + ' ppm' : ' · por ritmo, no por FC') };
  }
  if (it.sp === 'swim') {
    if (it.drill) return { main: 'Técnica', sub: 'sin reloj, calidad de movimiento' };
    if (it.kick) return { main: 'Suave', sub: 'con tabla' };
    const o = it.off;
    return { main: fmtPace(m.css + o) + ' /100 m', sub: 'CSS ' + (o === 0 ? '' : (o > 0 ? '+' : '−') + Math.abs(o) + '″') + (it.max ? ' · máximo' : '') };
  }
  return { main: '', sub: '' };
}
E.targetOf = targetOf;

/* ---------- constructores de bloques ---------- */
const B = (lo, hi, min, extra) => Object.assign({ sp: 'bike', lo, hi, min }, extra || {});
const Rn = (pace, min, extra) => Object.assign({ sp: 'run', pace, min }, extra || {});
const Rk = (pace, km, extra) => Object.assign({ sp: 'run', pace, km }, extra || {});
const S = (m, off, rst, extra) => Object.assign({ sp: 'swim', m, off, rst: rst || 0 }, extra || {});
const blk = (txt, n, items, extra) => Object.assign({ txt, n, items }, extra || {});

function blocksMin(blocks, m) {
  let t = 0;
  for (const b of blocks) {
    let one = 0; for (const it of b.items) { const inf = itemInfo(it, m); one += inf.min + (inf.restMin || 0); }
    t += one * b.n * (b.sets || 1) + (b.setRest ? itemInfo(b.setRest, m).min * ((b.sets || 1) - 1) : 0);
  }
  return t;
}
/* elige la opción de series más grande que cabe en el tiempo disponible */
function pickReps(avail, opts, maxIdx) {
  let best = 0;
  opts.forEach((o, i) => { const need = o[0] * o[1] + (o[0] - 1) * o[2]; if (need <= avail && i <= (maxIdx ?? 99)) best = i; });
  return opts[best];
}

/* ---------- sesiones de CICLISMO ---------- */
function bikeSession(kind, min, c) {
  const { m, phase, wip, ev, disc, p } = c;
  const lv = LVL[p.nivel] ?? 1;
  const WU = n => blk('Calentamiento progresivo', 1, [B(0.50, 0.68, n)]);
  const CD = n => blk('Vuelta a la calma', 1, [B(0.40, 0.55, n)]);
  const Z2 = (n, txt) => blk(txt || 'Resistencia aeróbica', 1, [B(0.65, 0.75, n)]);
  let title, blocks, notes = [], tag = '';
  const cyc = disc === 'ciclismo';
  const withFill = (core, wu, cd, fillTxt) => {
    const used = blocksMin(core, m) + wu + cd, rest = Math.max(0, min - used);
    const out = [WU(wu)];
    if (!core.length) { if (rest >= 1) out.push(Z2(rest, fillTxt)); out.push(CD(cd)); return out; }
    if (rest >= 1) out.push(Z2(Math.round(rest / 2) || rest, fillTxt));
    out.push(...core); if (rest >= 2) out.push(Z2(rest - Math.round(rest / 2), fillTxt)); out.push(CD(cd)); return out;
  };
  if (kind === 'rec') {
    title = 'Recuperación activa'; tag = 'suave';
    blocks = [blk('Rodar muy suave, cadencia 90–100 rpm', 1, [B(0.45, 0.55, min)])];
    notes.push('Hoy no se entrena: se recupera. Si las piernas piden más, no les hagas caso.');
  } else if (kind === 'end') {
    title = 'Resistencia aeróbica'; tag = 'aeróbico';
    blocks = [WU(10), blk('Z2 estable', 1, [B(0.65, 0.75, min - 15)]), CD(5)];
    if (phase === 'base') notes.push('Incluye 4 × 1 min a 105–110 rpm con la misma potencia para trabajar la economía de pedaleo.');
    notes.push('Z2 de verdad: si la FC deriva más de un 5 % en la segunda mitad, baja 10–15 W.');
  } else if (kind === 'long') {
    title = 'Fondo largo'; tag = 'larga';
    let core = [];
    if (phase === 'base') {
      if (wip >= 2) core = [blk('Tempo', 2 + (wip >= 4 ? 1 : 0), [B(0.76, 0.85, 10), B(0.60, 0.70, 10, { rest: true })])];
      notes.push('Base aeróbica: prioriza el tiempo sobre la bici. Come desde el minuto 45.');
    } else if (phase === 'build') {
      if (cyc) core = [blk(ev.key === 'xc' ? 'Tempo alto' : 'Bloques de tempo (en subida si puedes)', 3, [B(0.80, 0.88, 15), B(0.60, 0.70, 10, { rest: true })])];
      else core = [blk('Bloques a ritmo de carrera', ['medio', 'ironman', 'larga'].includes(ev.key) ? 2 : 3, [B(ev.bikeIF[0], ev.bikeIF[1], ['medio', 'ironman', 'larga'].includes(ev.key) ? 20 : 12), B(0.60, 0.70, 8, { rest: true })])];
      notes.push('Practica la nutrición de carrera: 60–80 g de hidratos por hora.');
    } else {
      title = 'Simulación de carrera'; tag = 'específica';
      if (cyc) {
        if (ev.key === 'granfondo') core = [blk('Ritmo de puerto', 3, [B(0.83, 0.90, 20), B(0.60, 0.70, 10, { rest: true })])];
        else if (ev.key === 'mtb') core = [blk('Subidas a umbral', 6, [B(0.95, 1.03, 6), B(0.55, 0.65, 6, { rest: true })])];
        else if (ev.key === 'carrera') core = [blk('Tempo con cambios de ritmo', 4, [B(0.85, 0.90, 8), B(1.20, 1.30, 1), B(0.55, 0.65, 6, { rest: true })])];
        else core = [blk('Umbral', 2, [B(0.95, 1.0, 12), B(0.55, 0.65, 6, { rest: true })])];
      } else {
        const big = ['medio', 'ironman', 'larga'].includes(ev.key);
        const blen = ev.key === 'ironman' ? 40 : big ? 30 : 15;
        core = [blk('Ritmo de carrera', big ? 2 : 3, [B(ev.bikeIF[0], ev.bikeIF[1], blen), B(0.60, 0.70, 8, { rest: true })])];
      }
      notes.push('Ensayo general: mismo desayuno, misma bebida, mismos geles y misma postura que el día de la carrera. 80–90 g de hidratos por hora.');
    }
    const cmin = blocksMin(core, m);
    if (cmin > min - 40) core = []; // no cabe: todo Z2
    blocks = withFill(core, 15, 10, 'Z2');
  } else if (kind === 'keyA' || kind === 'keyB') {
    tag = 'clave';
    const avail = min - 25;
    let core;
    if (!cyc && kind === 'keyA' && phase !== 'base') {
      const big = ['medio', 'ironman', 'larga'].includes(ev.key);
      if (phase === 'build' && !big) { const o = pickReps(avail, [[4, 8, 4], [3, 10, 5], [4, 10, 5], [3, 12, 5], [2, 20, 8], [3, 15, 5]], 1 + wip); title = 'Umbral'; core = [blk('Umbral', o[0], [B(0.95, 1.02, o[1]), B(0.50, 0.55, o[2], { rest: true })])]; }
      else if (phase === 'build') { const o = pickReps(avail, [[2, 15, 5], [3, 12, 5], [2, 20, 5], [3, 15, 5], [3, 20, 5], [2, 30, 5]], 1 + wip); title = 'Tempo / sweet spot'; core = [blk('Sweet spot', o[0], [B(0.85, 0.92, o[1]), B(0.50, 0.55, o[2], { rest: true })])]; }
      else {
        const opts = ev.key === 'ironman' ? [[2, 25, 5], [2, 30, 5], [3, 30, 5]] : big ? [[2, 20, 5], [3, 20, 5], [3, 25, 5]] : ['olimpico', 'estandar'].includes(ev.key) ? [[3, 10, 4], [3, 12, 4], [4, 12, 4]] : [[4, 6, 3], [5, 6, 3], [6, 6, 3]];
        const o = pickReps(avail, opts); title = 'Ritmo de carrera';
        core = [blk('Ritmo de carrera', o[0], [B(ev.bikeIF[0], ev.bikeIF[1], o[1]), B(0.50, 0.55, o[2], { rest: true })])];
      }
    } else if (phase === 'base' && kind === 'keyA') {
      const o = pickReps(avail, [[2, 12, 5], [3, 10, 5], [3, 12, 5], [2, 20, 5], [3, 15, 5], [4, 15, 5], [3, 20, 5]], 1 + wip);
      title = 'Sweet spot'; core = [blk('Sweet spot', o[0], [B(0.88, 0.93, o[1]), B(0.50, 0.55, o[2], { rest: true })])];
      notes.push('En el calentamiento, 3 × 1 min a 100 % FTP con 1 min suave para activar.');
    } else if (phase === 'base') {
      title = lv === 0 ? 'Tempo' : 'Tempo + sprints';
      const o = pickReps(avail - (lv === 0 ? 0 : 20), [[2, 12, 5], [2, 15, 5], [2, 20, 5], [3, 15, 5]], 1 + wip);
      core = [blk('Tempo', o[0], [B(0.76, 0.87, o[1]), B(0.50, 0.55, o[2], { rest: true })])];
      if (lv > 0) core.push(blk('Sprints de 10″ (sentado y de pie, alterna)', 6, [B(1.6, 1.8, 1 / 6, { max: true }), B(0.45, 0.55, 2.83, { rest: true })]));
    } else if (phase === 'build' && kind === 'keyA') {
      const o = pickReps(avail, [[4, 8, 4], [3, 10, 5], [4, 10, 5], [3, 12, 5], [2, 20, 8], [3, 15, 5]], 1 + wip);
      title = 'Umbral'; core = [blk('Umbral', o[0], [B(0.95, 1.02, o[1]), B(0.50, 0.55, o[2], { rest: true })])];
      notes.push('La última serie debe salir igual que la primera. Si cae más de un 5 %, corta ahí.');
    } else if (phase === 'build') {
      if (wip % 2 === 0) {
        const sets = avail >= 45 ? 3 : 2; title = 'VO2máx 30/15';
        core = [blk('30″ fuerte / 15″ suave (protocolo Rønnestad)', 13, [B(1.20, 1.30, 0.5), B(0.45, 0.55, 0.25, { rest: true })], { sets, setRest: B(0.45, 0.55, 3, { rest: true }) })];
        notes.push('Cada serie de 13 repeticiones dura 9 min 45 s. Cadencia alta, 95–105 rpm.');
      } else {
        const o = pickReps(avail, [[4, 4, 4], [5, 4, 4], [6, 4, 4], [5, 5, 5]], 1 + wip);
        title = 'VO2máx'; core = [blk('VO2máx', o[0], [B(1.08, 1.15, o[1]), B(0.45, 0.55, o[2], { rest: true })])];
      }
    } else { // spec ciclismo
      if (kind === 'keyA') {
        if (ev.key === 'xc') { title = 'Salidas + umbral'; core = [blk('Salida explosiva y umbral', 3, [B(1.30, 1.50, 1), B(0.95, 1.0, 7), B(0.50, 0.55, 5, { rest: true })])]; }
        else { const n = avail >= 50 ? 4 : avail >= 35 ? 3 : 2; title = 'Over-unders'; core = [blk('3 × (2′ a 92–95 % + 1′ a 105–110 %)', n, [B(0.92, 0.95, 2), B(1.05, 1.10, 1), B(0.92, 0.95, 2), B(1.05, 1.10, 1), B(0.92, 0.95, 2), B(1.05, 1.10, 1), B(0.50, 0.55, 5, { rest: true })])]; notes.push('Simula los cambios de ritmo de carrera: aprende a recuperar sin bajar de umbral.'); }
      } else { const o = pickReps(avail, [[5, 3, 3], [6, 3, 3], [8, 3, 3]]); title = 'VO2máx corto'; core = [blk('VO2máx', o[0], [B(1.10, 1.20, o[1]), B(0.45, 0.55, o[2], { rest: true })])]; }
    }
    blocks = withFill(core, 15, 10, 'Z2');
  } else if (kind === 'light') {
    title = 'Activación (semana de descarga)'; tag = 'descarga';
    blocks = withFill([blk('Sweet spot suave', 3, [B(0.86, 0.90, 6), B(0.50, 0.55, 4, { rest: true })])], 15, 10, 'Z2');
    notes.push('Semana de asimilación: la forma se construye ahora. Nada de "recuperar" volumen.');
  } else if (kind === 'opener') {
    title = 'Activación pre-carrera'; tag = 'afinamiento';
    blocks = withFill([blk('Umbral corto', 3, [B(0.95, 1.0, 3), B(0.50, 0.55, 3, { rest: true })]), blk('Aceleraciones', 3, [B(1.20, 1.30, 0.5), B(0.45, 0.55, 2, { rest: true })])], 10, 5, 'Z2');
    notes.push('Mantén la intensidad y baja el volumen: así llegas fresco sin perder forma.');
  } else if (kind === 'eve') {
    title = 'Víspera: activación'; tag = 'afinamiento';
    blocks = [blk('Rodar suave', 1, [B(0.55, 0.70, 15)]), blk('Aceleraciones a ritmo de carrera', 3, [B(0.95, 1.05, 1), B(0.50, 0.60, 2, { rest: true })]), blk('Suave', 1, [B(0.50, 0.60, 8)])];
    notes.push('Solo para despertar las piernas. Revisa la bici, presiones y el material al terminar.');
  } else if (kind === 'test') {
    title = 'Test de FTP (20 min)'; tag = 'test';
    blocks = [WU(20), blk('3 aceleraciones de 1′ a alta cadencia', 3, [B(1.0, 1.1, 1), B(0.50, 0.55, 1, { rest: true })]), blk('5′ fuerte para vaciar la capacidad anaeróbica', 1, [B(1.10, 1.20, 5)]), blk('Suave', 1, [B(0.45, 0.55, 10, { rest: true })]), blk('20 min al máximo sostenible', 1, [B(1.0, 1.08, 20)]), CD(10)];
    notes.push('FTP = 95 % de la potencia media de los 20 min. Empieza conservador y acaba vaciado. Actualiza tu perfil con el resultado.');
    min = blocksMin(blocks, m);
  }
  return { sport: 'bike', kind, title, tag, blocks, notes };
}

/* ---------- sesiones de CARRERA A PIE ---------- */
function racePaceCode(ev, disc) {
  if (disc === 'running') return { k5: 'K5', k10: 'K10', media: 'HM', maraton: 'M' }[ev.key] || 'T';
  return ev.run || 'T';
}
function runSession(kind, min, c) {
  const { m, phase, wip, ev, disc, p } = c;
  const lv = LVL[p.nivel] ?? 1;
  let title, blocks, notes = [], tag = '';
  const WU = n => blk('Calentamiento en rodaje suave', 1, [Rn('E', n)]);
  const CD = n => blk('Vuelta a la calma', 1, [Rn('REC', n)]);
  const strides = blk('Progresivos (20″ acelerando hasta ritmo R, 1′ al paso o trote)', 6, [Rn('R', 1 / 3), Rn('REC', 1, { rest: true })]);
  const withFill = (core, wu, cd) => {
    const used = blocksMin(core, m) + wu + cd, rest = Math.max(0, min - used);
    return [WU(wu + Math.round(rest * 0.4)), ...core, blk('Rodaje suave', 1, [Rn('E', Math.max(0, rest - Math.round(rest * 0.4)))]), CD(cd)].filter(b => b.items.every(i => (i.min ?? 1) > 0));
  };
  const rp = racePaceCode(ev, disc);
  if (kind === 'rec') {
    title = 'Rodaje regenerativo'; tag = 'suave';
    blocks = [blk('Trote muy suave, zancada corta', 1, [Rn('REC', min)])];
    notes.push('Superficie blanda si puedes (tierra, césped).');
  } else if (kind === 'end') {
    title = 'Rodaje aeróbico'; tag = 'aeróbico';
    const addStr = phase !== 'taper' && !c.rec && min >= 35;
    blocks = [blk('Rodaje en zona fácil', 1, [Rn('E', min - (addStr ? 8 : 0))])];
    if (addStr) blocks.push(strides);
    notes.push('Ritmo de conversación. El objetivo es acumular tiempo con poco impacto.');
  } else if (kind === 'long') {
    title = 'Tirada larga'; tag = 'larga';
    let core = [];
    if (disc === 'running' && ev.key === 'maraton' && phase === 'build') core = [blk('Final a ritmo maratón', 1, [Rn('M', clamp(Math.round(min * 0.2), 15, 30))])];
    else if (disc === 'running' && ev.key === 'maraton' && phase === 'spec') { title = 'Tirada larga específica'; core = [blk('Bloques a ritmo maratón', 2, [Rn('M', clamp(Math.round(min * 0.16), 15, 25)), Rn('E', 5, { rest: true })])]; }
    else if (disc === 'running' && ev.key === 'media' && phase === 'spec') { title = 'Tirada larga específica'; core = [blk('Bloques a ritmo de media', 3, [Rn('HM', 10), Rn('E', 3, { rest: true })])]; }
    else if (disc !== 'running' && phase === 'spec') core = [blk('Final a ritmo de carrera', 1, [Rn(rp, clamp(Math.round(min * 0.2), 10, 25))])];
    const cm = blocksMin(core, m);
    blocks = [blk('Rodaje en zona fácil', 1, [Rn('E', min - cm)]), ...core];
    notes.push('Hidrátate y, si pasa de 75–90 min, toma 30–60 g de hidratos por hora.');
    if (disc === 'running') notes.push('Regla de volumen: la tirada larga no debe superar ~25–30 % del kilometraje semanal.');
  } else if (kind === 'keyA' || kind === 'keyB') {
    tag = 'clave';
    const avail = min - 25;
    let core;
    if (phase === 'base' && kind === 'keyA') {
      const n = clamp(6 + wip, 6, 10); title = 'Cuestas';
      core = [blk('Cuesta de 60″ al 6–8 % (bajada trotando)', n, [Rn('HILL', 1), Rn('REC', 2, { rest: true })])];
      notes.push('Fuerza específica: rodillas altas, braceo activo, cadera alta. Es un trabajo de fuerza, no de sufrir.');
    } else if (phase === 'base') {
      const n = clamp(6 + wip, 6, 10); title = 'Fartlek';
      core = [blk('Fartlek', n, [Rn('T', 2), Rn('E', 1, { rest: true })])];
    } else if (phase === 'build' && kind === 'keyA') {
      const o = pickReps(avail, [[4, 6, 1], [3, 10, 2], [5, 6, 1], [4, 8, 1.5], [3, 12, 2.5], [4, 10, 2]], 1 + wip);
      title = 'Umbral (cruise intervals)'; core = [blk('Umbral', o[0], [Rn('T', o[1]), Rn('REC', o[2], { rest: true })])];
      notes.push('Ritmo "cómodamente duro": podrías decir frases cortas. 1 min de trote por cada 5 min a umbral.');
    } else if (phase === 'build') {
      const o = pickReps(avail, [[5, 3, 2.5], [6, 3, 2.5], [5, 4, 3], [6, 4, 3], [5, 5, 4]], 1 + wip);
      title = 'Intervalos VO2máx'; core = [blk('Intervalos', o[0], [Rn('I', o[1]), Rn('REC', o[2], { rest: true })])];
      notes.push('Daniels: el volumen a ritmo I no debería superar el 8 % del kilometraje semanal.');
    } else if (kind === 'keyA') {
      const cfg = { K5: [1, [4, 5, 6], 2], TS: [1, [4, 5, 6], 2], K10: [2, [3, 4, 5], 2], TO: [2, [3, 4], 2], HM: [3, [2, 3, 4], 2.5], TM: [3, [2, 3], 2.5], M: [5, [2, 3], 3], TIM: [5, [2, 3], 3], K10L: [2, [3, 4, 5], 2] }[rp] || [2, [3, 4], 2];
      const repMin = cfg[0] * m.pace[rp] / 60;
      let n = cfg[1][0]; for (const x of cfg[1]) if (x * repMin + (x - 1) * cfg[2] <= avail) n = x;
      title = 'Ritmo de carrera';
      core = [blk(cfg[0] + ' km a ritmo de carrera', n, [Rk(rp, cfg[0]), Rn('REC', cfg[2], { rest: true })])];
    } else {
      title = 'Umbral de mantenimiento'; core = [blk('Umbral', 3, [Rn('T', 8), Rn('REC', 2, { rest: true })])];
    }
    blocks = withFill(core, 15, 10);
  } else if (kind === 'light') {
    title = 'Rodaje con cambios (descarga)'; tag = 'descarga';
    blocks = withFill([blk('Cambios a umbral', 6, [Rn('T', 1), Rn('E', 1, { rest: true })])], 15, 5);
  } else if (kind === 'opener') {
    title = 'Activación pre-carrera'; tag = 'afinamiento';
    blocks = withFill([blk('A ritmo de carrera', 3, [Rk(rp, disc === 'running' && ev.key === 'maraton' ? 1.5 : 1), Rn('REC', 2, { rest: true })]), strides], 12, 5);
  } else if (kind === 'eve') {
    title = 'Víspera: activación'; tag = 'afinamiento';
    blocks = [blk('Rodaje suave', 1, [Rn('E', 12)]), blk('A ritmo de carrera', 3, [Rn(rp, 1), Rn('REC', 1, { rest: true })]), blk('Progresivos cortos', 4, [Rn('R', 1 / 4), Rn('REC', 1, { rest: true })]), blk('Suave', 1, [Rn('REC', 4)])];
    notes.push('Corto y alegre. Deja preparados dorsal, chip, geles y zapatillas.');
  } else if (kind === 'brick') {
    title = 'Transición (carrera tras la bici)'; tag = 'transición';
    const rpM = Math.round(min * 0.6);
    blocks = [blk('Sal de la bici directo a correr a ritmo de carrera', 1, [Rn(rp, rpM)]), blk('Rodaje suave', 1, [Rn('E', min - rpM)])];
    notes.push('Los primeros 3–5 min se sienten raros: cadencia alta (≥ 170 ppm) y zancada corta hasta que las piernas respondan.');
  } else if (kind === 'test') {
    title = 'Test de umbral (30 min)'; tag = 'test';
    blocks = [WU(15), strides, blk('30 min al máximo sostenible, en solitario', 1, [Rn('T', 30)]), CD(10)];
    notes.push('Umbral de FC = FC media de los últimos 20 min. Ritmo umbral ≈ ritmo medio de los 30 min. Actualiza tu perfil.');
  }
  return { sport: 'run', kind, title, tag, blocks, notes };
}

/* ---------- sesiones de NATACIÓN ---------- */
function swimSession(kind, min, c) {
  const { m, phase, ev } = c;
  let title, notes = [], tag = '';
  const WU = [blk('Calentamiento', 1, [S(400, 12, 0)]), blk('Técnica: 6-3-6, dedo arrastrado, puño cerrado', 4, [S(50, 15, 15, { drill: true })])];
  const CD = [blk('Vuelta a la calma', 1, [S(200, 15, 0)])];
  const fixed = blocksMin([...WU, ...CD], m);
  const fit = (unit, lo, hi) => clamp(Math.round((min - fixed) / blocksMin([blk('', 1, unit)], m)), lo, hi);
  let main;
  if (kind === 'keyA') {
    tag = 'clave';
    if (phase === 'base') { const u = [S(100, 0, 15)]; main = [blk('Series a CSS', fit(u, 6, 14), u)]; title = 'CSS · 100 m'; }
    else if (phase === 'build') { const u = [S(200, 1, 20)]; main = [blk('Series a CSS', fit(u, 4, 8), u)]; title = 'CSS · 200 m'; }
    else if (['medio', 'ironman'].includes(ev.key)) { const u = [S(400, ev.swimOff, 30)]; main = [blk('Ritmo de carrera', fit(u, 3, 6), u)]; title = 'Ritmo de carrera · 400 m'; }
    else { const u = [S(100, -2, 15)]; main = [blk('Por debajo de CSS', fit(u, 6, 12), u), blk('Rápidos', 4, [S(50, -5, 20)])]; title = 'Velocidad específica'; }
    notes.push('CSS: el ritmo que podrías sostener ~30 min. Descansos cortos y exactos.');
  } else if (kind === 'end') {
    tag = 'aeróbico'; const u = [S(400, 6, 30)]; main = [blk('Aeróbico largo (con pull-buoy en la última)', fit(u, 2, 6), u)]; title = 'Resistencia';
    notes.push('Respiración bilateral cada 3 brazadas; en aguas abiertas mira al frente cada 6–8 brazadas.');
  } else if (kind === 'tech' || kind === 'rec' || kind === 'light') {
    tag = 'técnica'; const u = [S(100, 7, 15)];
    main = [blk('Técnica: tabla lateral, remada, catch-up', 6, [S(50, 18, 15, { drill: true })]), blk('Aeróbico con foco en el agarre', fit(u, 4, 10) - 2, u), blk('Pies con tabla', 4, [S(50, 30, 15, { kick: true })])];
    title = 'Técnica y aeróbico';
  } else if (kind === 'opener') {
    tag = 'afinamiento'; title = 'Activación pre-carrera'; main = [blk('A ritmo de carrera', 4, [S(100, ev.swimOff || 2, 20)]), blk('Salidas rápidas', 4, [S(25, -8, 30)])];
  } else if (kind === 'eve') {
    tag = 'afinamiento'; title = 'Víspera: activación';
    main = [blk('Suave', 1, [S(200, 15, 0)]), blk('A ritmo de carrera, corto', 3, [S(50, ev.swimOff || 0, 30)])];
    notes.push('Solo para despertar los brazos. Deja preparados bañador, gorro, gafas y neopreno si lo usas.');
  } else if (kind === 'test') {
    tag = 'test'; title = 'Test de CSS (400 + 200)';
    main = [blk('400 m al máximo', 1, [S(400, -3, 0, { max: true })]), blk('Suave', 1, [S(200, 20, 0)]), blk('200 m al máximo', 1, [S(200, -6, 0, { max: true })])];
    notes.push('CSS (m/s) = 200 / (tiempo 400 − tiempo 200). Ejemplo: 7:20 y 3:20 → 200 / 240 s = 0,83 m/s → 2:00 /100 m.');
  }
  return { sport: 'swim', kind, title, tag, blocks: [...WU, ...main, ...CD], notes };
}

/* ---------- simulacro de duatlón (carrera–bici–carrera) ---------- */
function rbrSession(min, c) {

    blocks: [blk('Carrera 1: calentamiento', 1, [Rn('E', 10)]), blk('Carrera 1 a ritmo de carrera', 1, [Rn(rp, 15)]),
      blk('Bici a ritmo de carrera', 1, [B(ev.bikeIF[0], ev.bikeIF[1], bikeMin)]), blk('Carrera 2 a ritmo de carrera', 1, [Rn(rp === 'K5' ? 'K5' : 'K10L', 12)]), blk('Vuelta a la calma', 1, [Rn('REC', 8)])],

/* ---------- menús semanales por disciplina ---------- */

    add('bike', 'long', 'L', 0.30); add('bike', rec ? 'light' : taper ? 'opener' : 'keyA', 'K', 0.17);
    if (!rec && !(lv === 0 && phase === 'base')) add('bike', taper ? 'keyA' : 'keyB', 'K', 0.15);
    add('bike', 'end', 'L2', 0.18); add('bike', 'end', 'any', 0.12); add('bike', 'rec', 'any', 0.08); add('bike', 'end', 'any', 0.10);
  } else if (disc === 'running') {
    add('run', 'long', 'L', 0.28); add('run', rec ? 'light' : taper ? 'opener' : 'keyA', 'K', 0.17); add('run', 'end', 'any', 0.14);
    if (!rec && !(lv === 0 && phase === 'base')) add('run', taper ? 'keyA' : 'keyB', 'K', 0.15);
    add('run', 'rec', 'any', 0.10); add('run', 'end', 'any', 0.10); add('run', 'end', 'any', 0.08);
  } else if (disc === 'triatlon') {
    add('bike', 'long', 'L', 0.24); add('run', 'long', 'L2', 0.14);
    add('bike', rec ? 'light' : taper ? 'opener' : 'keyA', 'K', 0.12); add('run', rec ? 'light' : 'keyA', 'K', 0.10);
    add('swim', rec ? 'tech' : 'keyA', 'any', 0.08); add('swim', 'tech', 'any', 0.07);
    if (!rec && (phase === 'build' || phase === 'spec' || (taper && ev.key !== 'sprint'))) add('run', 'brick', 'BRICK', 0.04);
    add('bike', 'end', 'any', 0.08); add('swim', 'end', 'any', 0.07); add('run', 'end', 'any', 0.07); add('bike', 'rec', 'any', 0.05);
  } else {
    add('bike', 'long', 'L', 0.28); add('run', 'long', 'L2', 0.15);
    add('run', rec ? 'light' : 'keyA', 'K', 0.13); add('bike', rec ? 'light' : taper ? 'opener' : 'keyA', 'K', 0.13);
    if (!rec && (phase === 'build' || phase === 'spec')) add('run', 'brick', 'BRICK', 0.04);
    add('run', 'end', 'any', 0.09); add('bike', 'end', 'any', 0.10); add('run', 'rec', 'any', 0.07); add('bike', 'rec', 'any', 0.05);

}
const CLAMPS = {
  bike: { long: [75, 330], keyA: [60, 100], keyB: [60, 95], light: [50, 75], opener: [45, 70], eve: [25, 35], end: [45, 120], rec: [30, 60], test: [60, 70] },
  run: { long: [50, 150], keyA: [45, 75], keyB: [45, 70], light: [35, 55], opener: [30, 45], end: [30, 70], rec: [25, 40], brick: [10, 30], test: [60, 65] },
  swim: { keyA: [40, 75], tech: [35, 60], end: [40, 75], light: [35, 50], test: [45, 55], opener: [30, 40] }
};

/* ---------- fases y horas ---------- */

};

/* ---------- roles de los días ---------- */
const circ = (a, b) => { const d = Math.abs(a - b); return Math.min(d, 7 - d); };

/* ---------- preferencias por día: qué quieres hacer principalmente cada día ---------- */
E.PREF_OPTS = { ciclismo: ['bike', 'run', 'str'], running: ['run', 'bike', 'str'], triatlon: ['swim', 'bike', 'run', 'str'], duatlon: ['bike', 'run', 'str'] };
E.PREF_N = { bike: 'Bici', run: 'Carrera', swim: 'Natación', str: 'Fuerza' };
E.prefsOf = function (p) {
  const P = {}, raw = p.diaPref || {}, ok = E.PREF_OPTS[p.disciplina] || [];
  for (const d of (p.dias || [])) { const v = raw[d]; if (v && ok.includes(v)) P[d] = v; }
  return P;
};
const compatP = (P, d, sport) => !P[d] || P[d] === sport || (sport === 'multi' && (P[d] === 'bike' || P[d] === 'run'));

function dayRoles(days, L, disc, P) {

    const other = L === 5 ? 6 : L === 6 ? 5 : null;
    if (other !== null && ok(other)) return other;

    return best;

      const dist = Math.min(...[...hard, ...keys].map(h => circ(d, h)));
      const s = (dist >= 2 ? 20 : 0) + dist + pref[d];
      if (s > bs) { bs = s; best = d; }

/* ---------- construcción de una semana ---------- */
E.buildWeek = function (p, m, w, sec) {

  out.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.kind === 'brick' ? 1 : b.kind === 'brick' ? -1 : ord[a.sport] - ord[b.sport]));

/* ---------- pruebas B y C dentro de una semana ---------- */
function applySecondary(out, sec, mk, w, p, m, ctx) {
  if (!sec || !sec.length) return out;
  const sun = addDays(w.mon, 6);
