  for (const r of sec) {
    const d = r.fecha, prev = addDays(d, -1), next = addDays(d, 1);
    const rsp = r.disciplina === 'running' ? 'run' : r.disciplina === 'ciclismo' ? 'bike' : r.disciplina === 'natacion' ? 'swim' : 'multi';
    const same = s => rsp === 'multi' ? ['bike', 'run', 'multi'].includes(s.sport) : s.sport === rsp;
    if (inWeek(d)) {
      const rs0 = E.raceSession(p, m, r);
      const rs = finalize(Object.assign(rs0, { date: d, id: d + '_race_' + r.id, week: w.i, phase: w.phase, role: 'RACE' }), rs0._m || m);
      const onDay = out.filter(s => s.date === d);
      const replacedHard = onDay.some(s => same(s) && s.hard);
      const replacedLong = onDay.find(s => same(s) && (s.kind === 'long' || s.kind === 'rbr'));
      out = out.filter(s => s.date !== d);
      if (r.prioridad === 'B') {
        out = out.filter(s => s.date !== prev);
        out = out.filter(s => !(s.sport === 'str' && diffDays(s.date, d) > 0 && diffDays(s.date, d) <= 3));
        out = out.filter(s => !(same(s) && (s.kind === 'long' || s.kind === 'rbr')));
        out = out.filter(s => s.kind !== 'keyB' && s.kind !== 'brick');
        out = out.map(s => (diffDays(s.date, d) === 2 && s.hard) ? mk(s.sport === 'multi' ? 'bike' : s.sport, 'end', Math.min(45, s.min), s.date, { id: s.id, role: s.role, note: 'Suave: la prueba ' + (r.nombre || '') + ' es en dos días.' }) : s);
        if (inWeek(prev)) out.push(mk(rsp === 'run' ? 'run' : rsp === 'swim' ? 'swim' : 'bike', 'eve', 30, prev, { id: prev + '_eve_' + r.id, note: 'Activación para la prueba de mañana.', _ctx: Object.assign({}, ctx, { m: raceMetrics(p, m, r), ev: E.raceEvent(r), disc: r.disciplina }) }));
        if (inWeek(prev) && rsp === 'multi') out.push(mk('run', 'eve', 15, prev, { id: prev + '_eve2_' + r.id, note: 'Rodaje corto justo después de la bici.', _ctx: Object.assign({}, ctx, { m: raceMetrics(p, m, r), ev: E.raceEvent(r), disc: r.disciplina }) }));
      } else {
        const long = rs.min >= 90;
        if (!replacedHard) {
          const cands = out.filter(s => same(s) && (long ? (s.kind === 'long' || s.kind === 'rbr') : ['keyA', 'keyB'].includes(s.kind)));
          cands.sort((a, b) => Math.abs(diffDays(a.date, d)) - Math.abs(diffDays(b.date, d)));
          if (cands[0]) out = out.filter(s => s !== cands[0]);
        }
        if (replacedLong && rs.min < replacedLong.min * 0.6) {
          const extra = Math.round(clamp(replacedLong.min - rs.min - 15, 15, 90) / 5) * 5;
          const spx = rsp === 'run' ? 'run' : rsp === 'swim' ? 'swim' : 'bike';
          const post = mk(spx, 'end', extra, d, { id: d + '_' + spx + '_post_' + r.id, note: 'Después de la prueba: completa el volumen de la sesión larga en Z2.' });
          post.title = 'Rodaje suave tras la prueba';
          out.push(post);
        }
        out = out.filter(s => !(s.date === prev && s.sport === 'str'));
        out = out.map(s => (s.date === prev && s.hard) ? mk(s.sport === 'multi' ? 'bike' : s.sport, 'end', Math.min(45, s.min), s.date, { id: s.id, role: s.role, note: 'Suave: mañana tienes prueba.' }) : s);
      }
      out.push(rs);
    }
    // día(s) después: recuperación; tras una B o una prueba de 2,5 h o más, todo suave el día siguiente y sin calidad el segundo día
    const heavy = r.prioridad === 'B' || E.raceDurationFor(p, m, r) >= 150;
    const next2 = addDays(d, 2);
    out = out.map(s => {
      if (s.kind === 'race' || (s.date !== next && s.date !== next2) || !inWeek(s.date)) return s;
      if (s.date === next) {
        if (s.sport === 'str') return null;
        if (s.kind === 'rec' || (s.sport === 'swim' && !s.hard)) return s;
        if (heavy || s.hard) return mk(s.sport === 'multi' ? 'bike' : s.sport, 'rec', s.sport === 'swim' ? 30 : Math.min(40, s.min), s.date, { id: s.id, role: s.role, note: 'Recuperación: ayer fue día de carrera.' });

      }
      if (heavy && (s.hard || s.kind === 'light' || s.sport === 'str')) return s.sport === 'str' ? null : mk(s.sport === 'multi' ? 'bike' : s.sport, 'end', Math.min(50, s.min), s.date, { id: s.id, role: s.role, note: 'Sin calidad todavía: la prueba fue hace dos días.' });
      return s;
    }).filter(Boolean);
  }
  const ord = { swim: 0, bike: 1, multi: 1, run: 2, str: 3 };
  const late = x => x.kind === 'brick' || String(x.id).includes('_post_') ? 2 : x.kind === 'race' ? 1 : 0;
  return out.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (late(a) - late(b)) || (ord[a.sport] - ord[b.sport]));
}

/* ---------- semana de carrera ---------- */
function raceWeek(p, m, w, ev, days, mk) {
  const out = [], race = p.fechaCarrera, disc = p.disciplina;
  const main = disc === 'running' ? 'run' : 'bike';
  const multi = disc === 'triatlon' || disc === 'duatlon';
  const add = (sport, kind, min, date, extra) => out.push(mk(sport, kind, min, date, Object.assign({ id: date + '_' + sport + '_' + kind + '_1' }, extra)));
  const okDay = k => { const d = addDays(race, -k); return d >= w.mon && days.includes(dow(d)) ? d : null; };
  const f = clamp((w.peak || 8) / 8, 1, 1.8);
  const sc = x => Math.round(x * f / 5) * 5;
  // víspera: activación corta (siempre)
  const eve = addDays(race, -1);
  if (eve >= w.mon) {
    add(main, 'eve', 30, eve);
    if (multi) add('run', 'eve', 15, eve, { note: 'Rodaje corto justo después de la bici.' });
  }
  // afinamiento con series a ritmo de carrera: 4-5 días antes
  const sharpK = [4, 5, 3].find(k => okDay(k));
  if (sharpK) add(main, 'opener', sc(disc === 'running' ? 45 : 60), okDay(sharpK), { id: okDay(sharpK) + '_' + main + '_sharp_1', title: 'Afinamiento a ritmo de carrera' });
  // un rodaje suave y, en triatlón, un nado corto
  const easyK = [3, 6, 5, 2].find(k => k !== sharpK && okDay(k));
  if (easyK) add(multi && disc === 'duatlon' ? 'run' : main, 'end', sc(disc === 'running' ? 30 : 40), okDay(easyK));
  if (disc === 'triatlon') { const swK = [2, 3, 5, 6].find(k => k !== sharpK && k !== easyK && okDay(k)); if (swK) add('swim', 'opener', sc(30), okDay(swK)); }
  // carrera
  const rs = E.raceSession(p, m, p.raceObj);
  out.push(finalize(Object.assign(rs, { date: race, id: race + '_race', week: w.i, phase: 'race', role: 'RACE' }), rs._m || m));
  return out.sort((a, b) => a.date < b.date ? -1 : 1);
}
E.bikeSpeed = function (watts, kg, cda) { // km/h en llano, con factor de recorrido 0,92
  const mass = kg + 9, crr = 0.005, rho = 1.2;
  let v = 8; for (let i = 0; i < 60; i++) { const f = 0.5 * rho * cda * v * v * v + crr * mass * 9.81 * v - watts * 0.975; const d = 1.5 * rho * cda * v * v + crr * mass * 9.81; v -= f / d; }

};
E.climbMin = function (p, m, km, elev, ev, kmh) {

  for (let i = 0; i < 40; i++) { const f = mass * 9.81 * v * (grad + 0.005) + 0.228 * v * v * v - wc * 0.975; const dv = mass * 9.81 * (grad + 0.005) + 0.684 * v * v; v -= f / dv; }

E.raceLegs = function (p, m, r) {
  r = r || p.raceObj;

  const [a, bk, c] = ev.legs;

  const bike = elev > 0 ? E.climbMin(p, m, bk / 1000, elev, ev, kmh) : bk / 1000 / kmh * 60;

/* segmentos que se quitan de un triatlón o duatlón (claves del formulario: nat/run1, bici, carrera/run2) */
E.legsOff = function (r) {

/* tiempo estimado de una prueba con la forma actual */
E.raceDurationFor = function (p, m, r) {

    const kmh = E.bikeSpeed(w, +p.peso, mtb ? 0.40 : 0.34) * (mtb ? 0.8 : 1);

E.raceDuration = function (p, m) {

  return E.raceDurationFor(p, m, r);
};
/* viabilidad del objetivo de tiempo */
E.goalInfo = function (p, m, r) {

  const est = E.raceDurationFor(p, m, r) * 60;

E.goalText = function (gi) {

  const t = { realista: 'Objetivo realista con tu forma actual.', exigente: 'Objetivo exigente: alcanzable si el plan sale bien.', 'muy ambicioso': 'Objetivo muy ambicioso para tu forma actual: el plan entrena a un ritmo algo más prudente y lo ajustará cuando mejores en los tests.' };

/* métricas con el ritmo de carrera de esa prueba (carrera a pie) */
function raceMetrics(p, m, r) {

  const gi = E.goalInfo(p, m, r), v = gi && gi.vdotUse ? gi.vdotUse : m.vdot;
  const ev = E.raceEvent(r), km = ev.dist / 1000, flat = predictRace(v, ev.dist);
  const mm = Object.assign({}, m, { pace: Object.assign({}, m.pace) });
  mm.pace.RACE = (flat + (+r.desnivel || 0) * 0.8) / km; mm.pace.RACEFLAT = flat / km;

E.raceMetrics = raceMetrics;
E.raceSession = function (p, m, r) {
  r = r || p.raceObj || E.normRaces(p).find(x => x.prioridad === 'A');
  const ev = E.raceEvent(r), disc = r.disciplina, mr = raceMetrics(p, m, r);
  const min = E.raceDurationFor(p, m, r);
  const name = r.nombre || ev.n, gi = E.goalInfo(p, m, r);
  const blocks = [], notes = [];
  if (disc === 'running') {
    blocks.push(blk('Carrera: ' + name, 1, [Rk('RACE', ev.dist / 1000)]));
    notes.push('Ritmo ' + (gi ? 'objetivo' : 'previsto') + ' ' + fmtPace(mr.pace.RACEFLAT) + ' /km en llano' + (+r.desnivel ? ' (' + fmtPace(mr.pace.RACE) + ' /km de media con el desnivel; en las subidas, ve por esfuerzo y no por ritmo)' : '') + '. Primeros 2–3 km, 3–5 s/km más lentos.');
  } else if (disc === 'ciclismo') {
    blocks.push(blk('Carrera: ' + name, 1, [B(ev.bikeIF[0], ev.bikeIF[1], min)]));
    if (ev.key === 'xc') notes.push('Esfuerzo corto: no salgas por encima de ' + Math.round(m.ftp * 1.10) + ' W el primer minuto y sostén ' + Math.round(m.ftp * 0.98) + '–' + Math.round(m.ftp * 1.03) + ' W. Calienta 20 min con 2–3 aceleraciones.');
    else notes.push('Reparte el esfuerzo: en los puertos no pases de ' + Math.round(m.ftp * 0.92) + ' W salvo en el último' + (+r.desnivel ? ' (' + String(r.desnivel).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ' m de desnivel)' : '') + '. Come desde el minuto 20 aunque no tengas hambre.');

    }

};

/* ---------- temporada: pruebas A, B y C ---------- */
E.PRIO = {
  A: { n: 'A · objetivo', d: 'El plan se periodiza hasta aquí, con afinamiento completo.' },
  B: { n: 'B · importante', d: 'Mini-afinamiento: sin sesión larga esa semana, activación la víspera y recuperación el día después.' },
  C: { n: 'C · preparación', d: 'Se usa como entrenamiento: sustituye a una sesión de esa semana, sin afinamiento.' }
};
E.normRaces = function (p) {

  else list = p.fechaCarrera && E.EVENTS[p.disciplina] ? [{ id: 'principal', nombre: (E.EVENTS[p.disciplina][p.prueba] || {}).n || 'Prueba principal', fecha: p.fechaCarrera, disciplina: p.disciplina, prueba: p.prueba, prioridad: 'A', lugar: '', objetivo: 'terminar' }] : [];

E.raceEvent = function (r) {

    return Object.assign({}, E.EVENTS.running[best[0]], { key: best[0], n: String(d).replace('.', ',') + ' km', dist: d * 1000, custom: true, taper: d >= 30 ? 2 : d >= 15 ? 2 : 1 });
  }

  const out = Object.assign({ key: E.EVENTS[disc][r.prueba] ? r.prueba : Object.keys(E.EVENTS[disc])[0] }, ev);

};
E.calendarWarnings = function (races) {

  for (let i = 1; i < A.length; i++) { const gap = diffDays(A[i - 1].fecha, A[i].fecha); if (gap < 42) out.push('Entre ' + A[i - 1].nombre + ' y ' + A[i].nombre + ' hay ' + Math.round(gap / 7) + ' semanas: la segunda se preparará en modo mantenimiento. Lo ideal son 8–12 semanas entre pruebas A.'); }
  if (A.length > 3) out.push('Tienes ' + A.length + ' pruebas A: cada una pide 8–12 semanas de preparación. Considera pasar alguna a B.');
  for (const r of races) {
    if (r.prioridad === 'A') continue;
    const nextA = A.find(a => a.fecha > r.fecha);
    if (nextA && diffDays(r.fecha, nextA.fecha) <= 10) out.push(r.nombre + ' cae a ' + diffDays(r.fecha, nextA.fecha) + ' días de ' + nextA.nombre + ': resta frescura para tu objetivo. Hazla como C sin apretar o sáltatela.');
  }

/* ---------- cálculo final de cada sesión ---------- */

      s.title = 'Toma de contacto · ' + s.title; s.notes = ['Semana de arranque: rodajes suaves para que el cuerpo y el plan se conozcan. El plan estructurado empieza el lunes.'];
      pre.push(finalize(Object.assign(s, { date: d, id: d + '_' + sp + '_pre_1', week: -1, phase: 'arranque' }), m));
    }
  }
  sessions = pre.concat(sessions);
  // perfil "actual": el de la próxima prueba objetivo
  const cur = segs.find(sg => sg.race.fecha >= today) || segs[segs.length - 1];
  const finTemporada = races.length ? races[races.length - 1].fecha : p0.fechaCarrera;
  const pc = Object.assign({}, cur ? cur.ps : p0, { planStart: p0.planStart, horasActuales: p0.horasActuales, finTemporada, pruebas: races, disciplinaPrincipal: p0.disciplina });
  return { m, weeks, sessions, pre, races, segs, pc, target: cur ? cur.race : null, warnings: E.calendarWarnings(races) };
};

/* ---------- ajustes: mover, bloquear, suavizar ---------- */
E.applyAdjust = function (plan, st, p) {
  const ov = st.overrides || {};
  const m = plan.m;
  const list = [];
  for (const s0 of plan.sessions) {
    const o = ov[s0.id];
    let s = s0;
    if (o) {
      if (o.drop) { list.push(Object.assign({}, s0, { dropped: true, dropWhy: o.why || '' })); continue; }
      s = Object.assign({}, s0);
      if (o.date) { s.date = o.date; s.moved = s0.date; }
      if (o.mode) s = E.variant(s, o.mode, p, m);
    }
    list.push(s);
  }
  return list.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
};
E.variant = function (s, mode, p, m) {
  if (s.sport === 'str' || s.kind === 'race') {
    if (mode === 'descanso' || mode === 'sin_impacto') return Object.assign({}, s, { dropped: mode === 'descanso', mode, note: mode === 'sin_impacto' ? 'Solo core y tren superior hoy.' : '' });
    return s;
  }
  const ctx = { m, p, ev: Object.assign({ key: p.prueba }, E.event(p)), disc: p.disciplina, phase: s.phase === 'race' || s.phase === 'taper' ? 'taper' : s.phase, wip: 0, rec: false };
  const keep = { id: s.id, date: s.date, week: s.week, phase: s.phase, role: s.role, moved: s.moved, mode };
  if (mode === 'descanso') return Object.assign({}, s, { dropped: true, mode, dropWhy: 'Descanso por tu estado de hoy' });
  if (mode === 'suave') {
    const sp = s.sport === 'multi' ? 'bike' : s.sport;
    const min = Math.max(30, Math.round(s.min * 0.6 / 5) * 5);
    const b = sp === 'bike' ? bikeSession(min <= 45 ? 'rec' : 'end', Math.min(min, 75), ctx) : sp === 'run' ? runSession('rec', Math.min(min, 40), ctx) : swimSession('tech', Math.min(min, 45), ctx);
    b.notes = ['Sesión suavizada por tu estado de hoy. La sesión original se pierde: no intentes recuperarla mañana.'].concat(b.notes);
    return finalize(Object.assign(b, keep, { orig: s.title }), m);
  }
  if (mode === 'controlado') {
    const b = Object.assign({}, s, keep);
    const isCore = bl => bl.items.some(i => !i.rest) && !/calentamiento|calma|Z2|suave|rodaje/i.test(bl.txt);
    b.blocks = s.blocks.map(bl => {
      if (!isCore(bl)) return bl;
      if (bl.n > 2) return Object.assign({}, bl, { n: Math.max(2, Math.round(bl.n * 0.75)) });
      return Object.assign({}, bl, { items: bl.items.map(i => i.rest ? i : i.min ? Object.assign({}, i, { min: Math.round(i.min * 0.75) }) : i.km ? Object.assign({}, i, { km: Math.round(i.km * 0.75 * 2) / 2 }) : i.m ? Object.assign({}, i, { m: Math.round(i.m * 0.75 / 50) * 50 }) : i) });
    });
    b.notes = ['Volumen de trabajo reducido un 25 %. Si en el calentamiento la FC o los vatios no responden, pasa a Z2.'].concat(s.notes || []);
    return finalize(b, m);
  }
  if (mode === 'sin_impacto') {
    if (s.sport !== 'run' && s.sport !== 'multi') return s;
    const hasBike = p.disciplina !== 'running';
    const b = bikeSession('end', Math.min(s.min, 75), ctx);
    b.title = hasBike ? 'Bici aeróbica (sin impacto)' : 'Bici estática o elíptica (sin impacto)';
    b.notes = ['Sustituye la carrera para proteger la zona dolorida. Si el dolor persiste más de 3–5 días o cambia tu forma de moverte, consulta a un fisioterapeuta o médico.'];
    return finalize(Object.assign(b, keep, { orig: s.title }), m);
  }
  return s;
};

/* busca un hueco para una sesión dentro de su semana */
E.findSlot = function (sessions, s, p, blocked, fromDate) {
  const mon = mondayOf(s.date), single = p.disciplina === 'ciclismo' || p.disciplina === 'running';
  const maxPer = single ? 1 : 2;
  let best = null, bs = 1e9;
  for (let k = 0; k < 7; k++) {
    const d = addDays(mon, k);
    if (d === s.date || d < fromDate || (blocked && blocked[d]) || d >= (p.finTemporada || p.fechaCarrera)) continue;
    if (sessions.some(x => x.date === d && x.kind === 'race' && !x.dropped)) continue;
    const onDay = sessions.filter(x => x.date === d && !x.dropped && x.id !== s.id && x.sport !== 'str');
    if (s.sport !== 'str' && onDay.length >= maxPer) continue;
    if (onDay.some(x => x.sport === s.sport)) continue;
    let sc = onDay.reduce((a, x) => a + x.min, 0) + (p.dias.includes(dow(d)) ? 0 : 150);
    const pd = E.prefsOf(p)[dow(d)];
    if (pd && s.sport !== 'str') sc += compatP({ [dow(d)]: pd }, dow(d), s.sport) ? -30 : 60;
    const adj = sessions.filter(x => !x.dropped && x.hard && (x.date === addDays(d, 1) || x.date === addDays(d, -1)));
    if (s.hard) sc += adj.length * 120 + adj.filter(x => x.sport === s.sport).length * 200;
    if (s.sport === 'run' && adj.some(x => x.sport === 'run')) sc += 100;
    if (sc < bs) { bs = sc; best = d; }
  }
  return best && bs < 600 ? best : null;
};

/* no puedo entrenar un día: reubica o sustituye */
E.blockDay = function (p, adjusted, st, date, today) {
  const ov = JSON.parse(JSON.stringify(st.overrides || {}));
  const blocked = Object.assign({}, st.blocked || {}, { [date]: true });
  const done = st.done || {};
  const prio = s => s.kind === 'long' ? 0 : ['keyA', 'keyB', 'test', 'rbr'].includes(s.kind) ? 1 : s.kind === 'brick' ? 2 : s.sport === 'str' ? 3 : 4;
  const work = adjusted.map(s => Object.assign({}, s));
  const onDay = work.filter(s => s.date === date && !s.dropped && !done[s.id] && s.kind !== 'race').sort((a, b) => prio(a) - prio(b));
  const from = today > mondayOf(date) ? today : mondayOf(date);
  const res = [];
  for (const cur of onDay) {
    const slot = E.findSlot(work, cur, p, blocked, from);
    if (slot) { cur.date = slot; ov[cur.id] = Object.assign({}, ov[cur.id], { date: slot }); delete ov[cur.id].drop; res.push({ id: cur.id, title: cur.title, to: slot }); continue; }
    if (cur.hard) {
      const mon = mondayOf(date);
      const cand = work.filter(x => x.date >= from && mondayOf(x.date) === mon && x.date !== date && !x.dropped && !blocked[x.date] && ['end', 'rec', 'tech'].includes(x.kind) && !done[x.id]);
      cand.sort((a, b) => (a.sport === cur.sport ? 0 : 1) - (b.sport === cur.sport ? 0 : 1) || b.min - a.min);
      const c = cand[0];
      if (c) { ov[c.id] = { drop: true, why: 'Sustituida por ' + cur.title }; c.dropped = true; cur.date = c.date; ov[cur.id] = Object.assign({}, ov[cur.id], { date: c.date }); res.push({ id: cur.id, title: cur.title, to: c.date, replaced: c.title }); continue; }
    }
    ov[cur.id] = { drop: true, why: 'Día no disponible y sin hueco en la semana' }; cur.dropped = true; res.push({ id: cur.id, title: cur.title, dropped: true });
  }
  return { overrides: ov, blocked, res };
};
E.restoreWeek = function (plan, st, date) {
  const mon = mondayOf(date), sun = addDays(mon, 6);
  const ov = Object.assign({}, st.overrides || {}), blocked = Object.assign({}, st.blocked || {});
  for (const s of plan.sessions) if (s.date >= mon && s.date <= sun) delete ov[s.id];
  for (const d in blocked) if (d >= mon && d <= sun) delete blocked[d];
  return { overrides: ov, blocked };
};

/* ---------- carga: PMC (CTL/ATL/TSB) ---------- */
const RPE_IF = [0, 0.50, 0.55, 0.62, 0.70, 0.76, 0.82, 0.88, 0.94, 1.0, 1.06];
E.actualTSS = (s, rpe, min) => s.sport === 'str' ? Math.round(min * 0.5) : Math.round(min / 60 * RPE_IF[rpe] ** 2 * 100);
/* dado un IF (real o estimado a partir de FC/potencia), el RPE 1-10 cuya IF de referencia está más cerca */
E.impliedRPE = IF => { let best = 5, bd = Infinity; for (let i = 1; i < RPE_IF.length; i++) { const d = Math.abs(RPE_IF[i] - IF); if (d < bd) { bd = d; best = i; } } return best; };
E.pmc = function (p, sessions, st, today, assumeDone) {
  const start = p.creado && p.creado < p.planStart ? p.creado : p.planStart;
  const end = p.finTemporada || p.fechaCarrera;
  const baseTSS = (+p.horasActuales || +p.horas * 0.6) * 50 / 7;
  let ctl = baseTSS, atl = baseTSS;
  const byDay = {};
  for (const s of sessions) { if (s.dropped) continue; (byDay[s.date] = byDay[s.date] || []).push(s); }
  const out = [];
  for (let d = start; d <= addDays(end, 1); d = addDays(d, 1)) {
    let tss = 0;
    const list = byDay[d] || [];
    if (d < today) {
      if (p.creado && d < p.creado) tss = baseTSS;
      else for (const s of list) { const dn = st.done && st.done[s.id]; if (dn) tss += dn.tss; else if (assumeDone) tss += s.tss; }
    } else for (const s of list) { const dn = st.done && st.done[s.id]; tss += dn ? dn.tss : s.tss; }
    const tsb = ctl - atl;
    ctl += (tss - ctl) / 42; atl += (tss - atl) / 7;
    out.push({ d, tss: Math.round(tss), ctl: +ctl.toFixed(1), atl: +atl.toFixed(1), tsb: +tsb.toFixed(1), future: d >= today });
  }
  return out;
};

/* ---------- estado de forma (readiness) ---------- */
E.readiness = function (c, p, tsb) {
  if (!c) return null;
  const sH = clamp(((+c.sueno || 7) - 4) / 4, 0, 1) * 60 + ((+c.calidad || 3) - 1) / 4 * 40;
  const sF = (5 - (+c.fatiga || 3)) / 4 * 100, sD = (5 - (+c.dolor || 2)) / 4 * 100, sE = (5 - (+c.estres || 2)) / 4 * 100;
  let score = 0.35 * sH + 0.30 * sF + 0.20 * sD + 0.15 * sE;
  const why = [];
  if (+c.vfc && +p.vfcBase) { const r = c.vfc / p.vfcBase; if (r < 0.85) { score -= 25; why.push('VFC ' + Math.round((1 - r) * 100) + ' % por debajo de tu media'); } else if (r < 0.92) { score -= 12; why.push('VFC algo baja'); } }
  if (+c.fcr && +p.fcrBase) { const dlt = c.fcr - p.fcrBase; if (dlt >= 8) { score -= 20; why.push('FC en reposo +' + dlt + ' ppm'); } else if (dlt >= 5) { score -= 10; why.push('FC en reposo +' + dlt + ' ppm'); } }
  if (tsb != null && tsb < -30) { score -= 10; why.push('fatiga acumulada alta (TSB ' + Math.round(tsb) + ')'); }
  if ((+c.sueno || 7) < 6) why.push('menos de 6 h de sueño');
  if ((+c.fatiga || 3) >= 4) why.push('fatiga alta');
  if ((+c.dolor || 2) >= 4) why.push('dolor muscular alto');
  score = Math.round(clamp(score, 0, 100));
  let level, title, action, advice;
  if (c.enfermo === 'fiebre') { level = 'bad'; action = 'descanso'; title = 'Descanso total'; advice = 'Con fiebre o síntomas por debajo del cuello (pecho, estómago, dolores generalizados) no se entrena. Vuelve con 1–2 días suaves cuando lleves 24 h sin fiebre.'; }
  else if (c.lesion) { level = 'warn'; action = 'sin_impacto'; title = 'Sin impacto hoy'; advice = 'Cambia la carrera por bici o natación suave y evita cargar la zona. Si el dolor dura más de 3–5 días, empeora o te hace cojear, consulta a un profesional sanitario.'; }
  else if (c.enfermo === 'cuello') { level = 'warn'; action = 'suave'; title = 'Solo suave'; advice = 'Síntomas por encima del cuello (mocos, garganta): puedes moverte suave hasta 45 min en Z1–Z2. Si empeoras durante la sesión, para.'; }
  else if (score >= 70) { level = 'good'; action = 'ok'; title = 'Adelante con lo previsto'; advice = 'Buen estado. Haz la sesión tal y como está planificada.'; }
  else if (score >= 55) { level = 'ok'; action = 'controlado'; title = 'Hazla, pero controla'; advice = 'Mantén la sesión con un 25 % menos de trabajo principal. Si en el calentamiento no respondes, pasa a Z2.'; }
  else if (score >= 40) { level = 'warn'; action = 'suave'; title = 'Cambia a suave'; advice = 'Hoy tu cuerpo pide asimilar. Sustituye la sesión por un rodaje suave del 60 % de duración.'; }
  else { level = 'bad'; action = 'descanso'; title = 'Descansa'; advice = 'Varios indicadores en rojo. Descansar hoy te hará rendir más el resto de la semana.'; }
  return { score, level, title, action, advice, why };
};

const TPL = {

  return { items: list, tot: { ch: Math.round(tot.ch), p: Math.round(tot.p), f: Math.round(tot.f), kcal: Math.round(tot.ch * 4 + tot.p * 4 + tot.f * 9) } };

E.dayNutrition = function (p, m, daySessions, opts) {

E.mealPlan = function (p, d) {

  const T = { manana: { pre: '6:30', train: '7:30', after: '9:45' }, mediodia: { pre: '11:30', train: '13:00', after: '15:00' }, tarde: { pre: '16:30', train: '18:30', after: '21:00' } }[when];
  if (!main) {
    slots.push(['desayuno', 'Desayuno', '8:00', 0.28, 0.25, 0.2], ['media', 'Media mañana', '11:00', 0.1, 0.1, 0.08], ['comida', 'Comida', '14:00', 0.34, 0.3, 0.35], ['merienda', 'Merienda', '17:30', 0.14, 0.18, 0.15], ['cena', 'Cena', '21:00', 0.24, 0.27, 0.3]);

    if (needPre) slots.push(['pre', 'Antes de entrenar', T.pre, 'pre05', 0, 0]);
    slots.push(['during', 'Durante el entrenamiento', T.train]);
    slots.push(['comida', 'Comida de recuperación', T.after, 'rec', 'rec', 0.3]);

/* ============ MOTOR ADAPTATIVO ============
   Adherencia reciente + carga sRPE (minutos × esfuerzo percibido) + ratio agudo:crónico → decisión
   que recorta o mantiene el volumen de las semanas futuras, y proyección de tiempo con techo realista. */
const ADH_W = { keyA: 3, keyB: 3, test: 3, race: 3, rbr: 3, long: 3, brick: 3, end: 1, rec: 1, light: 1, tech: 1 };
const RPE_KIND = { rec: 3, tech: 3, end: 4, light: 4, long: 6, brick: 7, keyA: 8, keyB: 8, rbr: 8, test: 9, race: 10 };
E.riegelExp = km => km <= 5 ? 1.075 : km <= 10 ? 1.062 : 1.05;
E.riegel = (sec, km, toKm) => sec * Math.pow((toKm || 21.0975) / km, E.riegelExp(km));
/* carga de una sesión: minutos × RPE. La fuerza marcada a medias cuenta a medias */
E.sessionSRPE = function (s, d) {
  const min = +(d && d.min) || s.min || 0;
  const rpe = +(d && d.rpe) || (s.sport === 'str' ? 5 : RPE_KIND[s.kind]) || 4;
  const f = d && d.ex != null ? d.ex : 1;
  return min * rpe * f;
};
E.weekLoadOf = (list, isDone, done) => Math.round(list.filter(s => !s.dropped && isDone(s)).reduce((a, s) => a + E.sessionSRPE(s, done[s.id]), 0));
E.motorDecide = function (adh, acwr, wl) {
  const pc = v => Math.round(v * 100);
  if (acwr != null && acwr > 1.5) return { id: 'recortar', label: 'Recortar ya', vol: 0.82, cut: 1, tone: 'bad', rule: 4,
    why: `Tu carga de esta semana es ${(Math.round(acwr * 100) / 100).toString().replace('.', ',')}× tu media de las 4 semanas anteriores. Por encima de 1,5 el riesgo de lesión se multiplica. Recorto un 18 % el volumen de las semanas que vienen y quito una sesión clave, aunque te encuentres bien.` };
  if (adh == null) return { id: 'esperar', label: 'Sin datos', vol: 1, cut: 0, tone: 'mute', rule: -1,
    why: 'Marca tus sesiones como hechas durante unos días y el motor empezará a adaptar el plan. Hasta entonces ves el plan base tal como está diseñado.' };
  if (adh >= 0.9 && (acwr == null || acwr <= 1.3)) return { id: 'progresar', label: 'Progresar', vol: 1, cut: 0, tone: 'ok', rule: 0,
    why: `Adherencia del ${pc(adh)} % con la carga bajo control. El plan sigue exactamente como está diseñado: lo que funciona no se toca.` };
  if (adh >= 0.75) return { id: 'mantener', label: 'Mantener', vol: 0.95, cut: 0, tone: 'ok', rule: 1,
    why: `Adherencia del ${pc(adh)} %. Estás cerca, pero con huecos. Bajo un 5 % el volumen futuro para que completes enteras las sesiones clave: vale más una serie completa que dos a medias.` };
  if (adh >= 0.6) return { id: 'consolidar', label: 'Consolidar', vol: 0.88, cut: 1, tone: 'warn', rule: 2,
    why: `Adherencia del ${pc(adh)} %. Estás perdiendo sesiones que importan. Recorto un 12 % el volumen futuro y quito una sesión clave para que la semana sea alcanzable. Progresar sobre una base con agujeros es como se acaba lesionado.` };
  return { id: 'reconstruir', label: 'Reconstruir', vol: 0.78, cut: 1, tone: 'bad', rule: 3,
    why: `Adherencia del ${pc(adh)} %. El plan actual no encaja con tu vida real. Recorto un 22 % el volumen futuro y quito una sesión clave de la semana que viene. Con ${wl} semana${wl === 1 ? '' : 's'} por delante, mejor un plan más pequeño que cumplas que uno grande que no.` };
};

/* ctx: { plan, adj, today, isDone(s), done, raceDate } */
E.motorState = function (ctx) {
  const { plan, adj, today, isDone, done } = ctx;
  const mons = plan.weeks.map(w => w.mon), byMon = {};
  for (const s of adj) if (!s.dropped) (byMon[E.mondayOf(s.date)] = byMon[E.mondayOf(s.date)] || []).push(s);
  const loads = mons.map(m0 => E.weekLoadOf(byMon[m0] || [], isDone, done));
  const planned = mons.map(m0 => E.weekLoadOf(byMon[m0] || [], () => true, {}));
  let cur = mons.findIndex(m0 => today >= m0 && today <= addDays(m0, 6));
  if (cur < 0) cur = today > mons[mons.length - 1] ? mons.length - 1 : -1;
  let adh = null, seen = 0;
  if (cur >= 0) {
    let got = 0, tot = 0;
    for (let i = Math.max(0, cur - 2); i <= cur; i++) for (const s of byMon[mons[i]] || []) {
      const w = ADH_W[s.kind] || 0;
      if (!w || s.sport === 'str') continue;
      const dn = isDone(s);
      if (dn) seen++;
      if (s.date < today || dn) { tot += w; if (dn) got += w; }
    }
    if (tot >= 4 && seen >= 2) adh = got / tot;
  }
  const prev = []; for (let i = Math.max(0, cur - 4); i < cur; i++) if (loads[i] > 0) prev.push(loads[i]);
  const acute = cur >= 0 ? loads[cur] : 0;
  const acwr = prev.length && acute ? acute / (prev.reduce((a, b) => a + b, 0) / prev.length) : null;
  const wl = ctx.raceDate ? Math.max(0, Math.ceil(E.diffDays(today, ctx.raceDate) / 7)) : 0;
  return { mons, loads, planned, cur, adh, seen, acwr, wl, dec: E.motorDecide(adh, acwr, wl) };
};
/* escala el trabajo de una sesión (todo salvo calentamiento y vuelta a la calma) */
E.scaleSession = function (s, f, m) {
  if (s.sport === 'str' || f >= 0.995 || !s.blocks) return s;
  const b = Object.assign({}, s);
  b.blocks = s.blocks.map(bl => {
    if (/calentamiento|vuelta a la calma|enfriamiento/i.test(bl.txt)) return bl;
    if (bl.n > 2 && !(bl.sets > 1)) return Object.assign({}, bl, { n: Math.max(2, Math.round(bl.n * f)) });
    return Object.assign({}, bl, { items: bl.items.map(i => i.rest ? i : i.min ? Object.assign({}, i, { min: Math.max(5, Math.round(i.min * f)) }) : i.km ? Object.assign({}, i, { km: Math.max(1, Math.round(i.km * f * 2) / 2) }) : i.m ? Object.assign({}, i, { m: Math.max(100, Math.round(i.m * f / 50) * 50) }) : i) });
  });
  b.motor = true;
  b.notes = [`El motor ha ajustado el volumen al ${Math.round(f * 100)} % por tu adherencia y carga recientes.`].concat(s.notes || []);
  return finalize(b, m);
};
/* aplica la decisión a las semanas futuras (la actual no se toca; afinamiento y carrera, tampoco) */
E.motorApply = function (adj, plan, dec, today, p, m) {
  if (!dec || (dec.vol >= 1 && !dec.cut)) return adj;
  const nextMon = addDays(mondayOf(today), 7), wk = {};
  for (const w of plan.weeks) wk[w.mon] = w;
  let cutDone = false;
  return adj.map(s => {
    if (s.dropped || s.sport === 'str' || s.mode || ['race', 'test'].includes(s.kind) || s.date < nextMon) return s;
    const w = wk[mondayOf(s.date)];
    if (!w || w.phase === 'taper' || w.phase === 'race') return s;
    if (dec.cut && !cutDone && mondayOf(s.date) === nextMon && (s.kind === 'keyA' || s.kind === 'keyB')) {
      cutDone = true;
      const v = E.variant(s, 'suave', p, m);
      v.motor = true; v.mode = null;
      v.notes = ['El motor ha quitado esta sesión clave por tu adherencia o carga recientes. Rueda cómodo en Z2.'].concat((v.notes || []).slice(1));
      return v;
    }
    return E.scaleSession(s, dec.vol, m);
  });
};
/* forma actual para una distancia: última referencia (Riegel) → marca del perfil → estimación por VDOT */
E.formRef = function (p, refs) {
  const rs = (refs || []).filter(r => +r.km >= 3 && +r.sec > 0).sort((a, b) => a.date < b.date ? 1 : -1);
  if (rs.length) return { km: +rs[0].km, sec: +rs[0].sec, date: rs[0].date, kind: 'ref' };
  const t = parseClock(p.marcaTiempo);
  if (+p.marcaDist && t) return { km: +p.marcaDist / 1000, sec: t, date: null, kind: 'perfil' };
  return null;
};
E.formTime = function (p, m, refs, distM) {
  const r = E.formRef(p, refs);
  if (r) return { sec: Math.abs(r.km * 1000 - distM) < 1 ? r.sec : E.riegel(r.sec, r.km, distM / 1000), ref: r };
  return { sec: predictRace(m.vdot, distM), ref: null };
};
/* proyección: la mejora ataca el hueco hasta un techo (+0,35 VDOT por semana, máx. +3), a razón de un 3 % del
   hueco por semana bien hecha, con tope del 60 %, y nunca lo cruza */
E.projectTime = function (nowSec, distM, wl, adh) {
  const v0 = vdotFromRace(distM, nowSec), ceilSec = Math.min(nowSec, predictRace(v0 + Math.min(3, 0.35 * wl), distM));
  const q = adh == null ? 0.75 : Math.min(1, Math.max(0.3, adh));
  const closed = (nowSec - ceilSec) * Math.min(0.6, 0.03 * wl) * q;
  return { now: nowSec, proj: Math.max(ceilSec, nowSec - closed), ceiling: ceilSec, gain: closed };
};
E.raceProjections = function (p, m, refs, races, today, adh) {
  return races.filter(r => r.fecha >= today && r.disciplina === 'running').slice(0, 4).map(r => {
    const ev = E.raceEvent(r), wl = Math.max(0, Math.ceil(E.diffDays(today, r.fecha) / 7));
    const ft = E.formTime(p, m, refs, ev.dist), pr = E.projectTime(ft.sec, ev.dist, wl, adh);
    const goal = r.objetivo === 'tiempo' ? parseClock(r.objetivoTiempo) : null;
    return Object.assign({ r, ev, wl, goal, ref: ft.ref, pace: pr.proj / (ev.dist / 1000) }, pr);
  });
};
/* reparto de intensidad de una semana, contado por sesión: lo que decide si el plan funciona es
   cuántas sesiones son duras, no cuántos minutos */
E.sessionIntensity = function (s) {
  if (s.dropped || s.sport === 'str') return null;
  if (s.kind === 'race' || s.kind === 'test') return 'hard';
  if (s.extra) return s.IF >= 0.88 ? 'hard' : s.IF >= 0.78 ? 'mod' : 'easy';
  const st = (s.steps || []).filter(x => !x.rest), tot = st.reduce((a, x) => a + x.min, 0) || 1;
  const hardMin = st.filter(x => x.z >= 3).reduce((a, x) => a + x.min, 0), modMin = st.filter(x => x.z === 2).reduce((a, x) => a + x.min, 0);
  if (hardMin >= 6) return 'hard';
  if (hardMin > 0 || modMin / tot >= 0.25) return 'mod';
  return 'easy';
};
E.weekSpread = function (list) {
  const o = { easy: 0, mod: 0, hard: 0, tot: 0 };
  for (const s of list) { const k = E.sessionIntensity(s); if (k) { o[k]++; o.tot++; } }
  return o;
};

/* ---------- restricciones del perfil ---------- */
E.restrictions = function (p) {
  const allergy = new Set(p.alergias || []), diet = new Set(DIET_BLOCK[p.dieta || 'omnivora'] || []), intol = new Set(), soft = new Set();
  for (const i of p.intolerancias || []) { if (i === 'LA') intol.add('LA'); else if (i === 'GLS') intol.add('GL'); else soft.add(i); }
  const avoid = String(p.evitar || '').split(/[,;\n]/).map(s => norm(s.trim())).filter(s => s.length >= 3);
  const hard = new Set([...allergy, ...diet, ...intol]);
  return { allergy, diet, intol, hard, soft, avoid, trazas: !!p.trazas, dietName: p.dieta || 'omnivora', empty: !hard.size && !soft.size && !avoid.length };
};
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const DIET_TXT = { M: 'lleva carne', F: 'lleva pescado o marisco', HU: 'lleva huevo', LE: 'lleva lácteos', MI: 'lleva miel' };
/* problemas de un alimento con tus restricciones: hard = no apto; soft = con cuidado; traces = puede contener */
E.foodIssues = function (food, R) {
  const out = { hard: [], soft: [], traces: [], ok: true };
  if (!food || !R) return out;
  const tags = food.tags || [];
  for (const t of tags) {
    if (R.allergy.has(t)) out.hard.push('alérgeno: ' + E.TAGN[t]);
    else if (R.intol.has(t)) out.hard.push(t === 'LA' ? 'lactosa' : 'gluten');
    else if (R.diet.has(t)) out.hard.push(DIET_TXT[t] || E.TAGN[t]);
    else if (R.soft.has(t)) out.soft.push(E.TAGN[t]);
  }
  if (R.trazas) for (const t of food.traces || []) if (R.allergy.has(t) && !tags.includes(t)) out.traces.push(E.TAGN[t]);
  const nm = norm(food.name + ' ' + (food.ingredients || ''));
  for (const w of R.avoid) if (nm.includes(w)) out.hard.push('lo evitas (' + w + ')');
  out.hard = [...new Set(out.hard)]; out.soft = [...new Set(out.soft)]; out.traces = [...new Set(out.traces)];
  out.ok = !out.hard.length && !out.traces.length;
  return out;
};
E.foodOf = (id, custom) => (custom && custom[id]) || E.FOODDB[id] || null;
/* primer alimento apto: el propio o un sustituto; evita también lo "con cuidado" si hay alternativa limpia */
E.resolveFood = function (id, R) {
  if (!R || R.empty) return id;
  const cands = [id].concat(E.ALT[id] || []);
  for (const c of cands.slice(1)) for (const c2 of E.ALT[c] || []) if (!cands.includes(c2)) cands.push(c2);
  let soft = null;
  for (const c of cands) {
    const f = E.FOODDB[c]; if (!f) continue;
    const is = E.foodIssues(f, R);
    if (!is.ok) continue;
    if (!is.soft.length) return c;
    if (!soft) soft = c;
  }
  return soft;
};

E.adaptRecipe = function (r, R) {

/* ---------- objetivo nutricional ---------- */
E.GOAL_N = { mantener: 'Mantener peso y rendir', perder: 'Perder grasa', ganar: 'Ganar masa muscular', recomp: 'Recomposición' };
const RATE = { perder: { lento: 0.0025, moderado: 0.005, rapido: 0.0075 }, ganar: { lento: 0.0025, moderado: 0.005 } };
E.RATE_N = { lento: 'Lento', moderado: 'Moderado', rapido: 'Rápido' };
E.nutriGoal = function (p, wNow) {
  let goal = p.objetivoNutri || 'mantener';
  if (goal === 'rendimiento') goal = 'mantener';
  const W = +wNow || +p.peso;
  const ritmo = RATE[goal] ? (RATE[goal][p.ritmo] ? p.ritmo : 'moderado') : null;
  const pct = ritmo ? RATE[goal][ritmo] : 0;
  const tgt = +p.pesoObjetivo || null;
  const out = { goal, declared: goal, ritmo, pct, kgWk: +(pct * W).toFixed(2), W, target: tgt, notes: [] };
  const bmi = W / Math.pow((+p.altura || 170) / 100, 2);
  const bfLow = +p.grasa && ((p.sexo === 'mujer' && +p.grasa < 15) || (p.sexo !== 'mujer' && +p.grasa < 8));
  if (goal === 'perder' && (bmi < 18.5 || bfLow)) { out.goal = 'mantener'; out.blocked = true; out.notes.push(bmi < 18.5 ? 'Con un IMC de ' + bmi.toFixed(1).replace('.', ',') + ' no se recomienda perder peso: el plan te mantiene en mantenimiento. Coméntalo con un dietista-nutricionista.' : 'Con tu porcentaje de grasa no se recomienda seguir bajando: el plan te mantiene en mantenimiento.'); }
  if (tgt && goal === 'perder' && W <= tgt) { out.goal = 'mantener'; out.reached = true; out.notes.push('Has llegado a tu peso objetivo: ahora comes a mantenimiento.'); }
  if (tgt && goal === 'ganar' && W >= tgt) { out.goal = 'mantener'; out.reached = true; out.notes.push('Has llegado a tu peso objetivo: ahora comes a mantenimiento.'); }
  out.protK = ({ mantener: 1.7, perder: pct >= 0.0075 ? 2.2 : 2.0, ganar: 1.9, recomp: 2.2 }[out.goal]) + (p.dieta === 'vegana' ? 0.1 : 0);
  if (out.reached || out.blocked) { out.pct = 0; out.kgWk = 0; }
  return out;
};

/* gasto y categoría de un día */
const CATS = E.CATS;
E.dayBase = function (p, m, sessions, W) {
  const kg = +W || +p.peso, list = (sessions || []).filter(s => !s.dropped);
  const mifflin = 10 * kg + 6.25 * +p.altura - 5 * +p.edad + (p.sexo === 'mujer' ? -161 : 5);
  const pal = { sedentario: 1.4, pie: 1.55, fisico: 1.75 }[p.trabajo] || 1.45;
  const perH = mifflin * pal / 24;
  let exGross = 0, exNet = 0, tss = 0, min = 0, hard = false, str = false;
  for (const s of list) {
    const h = s.min / 60; let kcal;
    if (s.sport === 'bike' || s.sport === 'multi') kcal = m.ftp * (s.IF || 0.65) * 0.97 * s.min * 60 / 1000 * (s.sport === 'multi' ? 1.05 : 1);
    else if (s.sport === 'run') kcal = kg * (s.km || s.min / (m.pace.E / 60));
    else if (s.sport === 'swim') kcal = clamp(7 + ((s.IF || 0.75) - 0.8) * 15, 5.5, 10.5) * kg * h;
    else kcal = 5 * kg * h;
    exGross += kcal; exNet += Math.max(0, kcal - perH * h); tss += s.tss || 0; min += s.min; hard = hard || !!s.hard || s.kind === 'race'; str = str || s.sport === 'str';
  }
  const endMin = list.filter(s => s.sport !== 'str').reduce((a, s) => a + s.min, 0);
  const ci = min === 0 ? 0 : (tss < 40 && endMin <= 60) ? 1 : (tss < 90 && endMin < 105) ? 2 : tss < 150 ? 3 : tss < 230 ? 4 : 5;
  const bf = +p.grasa ? +p.grasa / 100 : (p.sexo === 'mujer' ? 0.23 : 0.15);
  return { kg, mifflin, pal, exGross, exNet, tss, min, endMin, hard, str, ci, cat: CATS[ci], maint: mifflin * pal + exNet, ffm: kg * (1 - bf), list };
};

/* ---------- objetivos de una semana: el déficit o superávit se reparte entre los días que lo toleran ---------- */
// days: [{date, sessions}] (7, lunes a domingo); ctx: {races:[{fecha, prioridad, min}], phaseOf(date), gate(date)->texto|null, W, adj}
E.nutriWeek = function (p, m, days, ctx) {
  ctx = ctx || {};
  const G = E.nutriGoal(p, ctx.W);
  const W = G.W;
  const races = ctx.races || [];
  const res = days.map(d => {
    const b = E.dayBase(p, m, d.sessions, W);
    const ph = ctx.phaseOf ? ctx.phaseOf(d.date) : null;
    const flags = [];
    const raceToday = races.find(r => r.fecha === d.date);
    const next = races.find(r => r.fecha > d.date && (r.prioridad === 'A' || r.prioridad === 'B'));
    const prev = races.filter(r => r.fecha < d.date && (r.prioridad === 'A' || r.prioridad === 'B')).pop();
    const dn = next ? E.diffDays(d.date, next.fecha) : 99, dp = prev ? E.diffDays(prev.fecha, d.date) : 99;
    // carga de hidratos (Burke et al.): > 150 min, 10–12 g/kg 36–48 h; 90–150 min, 8–10 g/kg 24–36 h; más corta, 7–8 g/kg la víspera
    let load = 0;
    if (next && next.prioridad === 'A' && next.min >= 150 && dn <= 2) load = 10;
    else if (next && next.min >= 90 && dn <= (next.prioridad === 'A' ? 2 : 1)) load = 8;
    else if (next && dn === 1 && next.prioridad === 'A') load = 7;
    if (raceToday) flags.push('carrera');
    if (load) flags.push('carga');
    if (dp === 1 && !raceToday) flags.push('postcarrera');
    if (next && dn <= 2 && !load) flags.push('precarrera');
    if (ph === 'taper' || ph === 'race') flags.push('afinamiento');
    const gate = ctx.gate ? ctx.gate(d.date) : null;
    return { date: d.date, b, flags, load, raceToday, next, dn, gate };
  });
  // capacidad de déficit / superávit de cada día
  const noDef = x => x.flags.some(f => ['carrera', 'carga', 'postcarrera', 'precarrera', 'afinamiento'].includes(f));
  const wkDelta = G.goal === 'perder' ? G.pct * W * 7700 : G.goal === 'ganar' ? (G.ritmo === 'lento' ? 250 : 400) * 7 : 0;
  for (const x of res) {
    x.w = 0; x.cap = 0;
    // descanso, suave y moderado cargan con el déficit; un día duro admite uno pequeño (≤ 8 %) que sale de la grasa, nunca de los hidratos
    if (G.goal === 'perder' && !noDef(x) && x.b.ci <= 3) { x.w = [1, 0.8, 0.6, 0.25][x.b.ci]; x.cap = [0.25, 0.2, 0.15, 0.08][x.b.ci] * x.b.maint; }
    if (G.goal === 'ganar' && !noDef(x)) { x.w = x.b.min ? (x.b.str || x.b.hard ? 1.3 : 1) : 0.6; x.cap = 0.2 * x.b.maint; }
  }
  const sw = res.reduce((a, x) => a + x.w, 0);
  let planned = 0;
  for (const x of res) { x.delta = sw ? Math.min(x.cap, wkDelta * x.w / sw) : 0; planned += x.delta; }
  // si los topes dejan déficit sin repartir, se reparte entre los que tienen margen (una pasada)
  let left = wkDelta - planned;
  if (left > 50) { const room = res.filter(x => x.w && x.delta < x.cap); const sw2 = room.reduce((a, x) => a + x.w, 0); for (const x of room) { const add = Math.min(x.cap - x.delta, left * x.w / sw2); x.delta += add; } }
  const out = res.map(x => E.nutriDayFrom(p, G, x, ctx));
  out.goal = G;
  out.wkTarget = Math.round(wkDelta);
  out.wkPlanned = Math.round(Math.abs(out.reduce((a, t) => a + t.delta, 0)));
  return out;
};
E.nutriDayFrom = function (p, G, x, ctx) {

  if (G.goal === 'perder' && delta > 0 && x.gate) { gated = x.gate; delta = 0; }
  if (G.goal === 'recomp') delta = x.flags.length ? 0 : (b.min === 0 || b.ci <= 1) && !b.str ? Math.min(350, 0.12 * b.maint) : 0;

  else if (G.goal === 'ganar') chk = lo + (hi - lo) * 0.7;
  else if (G.goal === 'recomp') chk = delta > 0 ? lo : (lo + hi) / 2;

  }

  if (x.load) why.push('Carga de hidratos para ' + (x.next ? x.next.nombre || 'la prueba' : 'la prueba') + ': ' + (x.load >= 10 ? '10–12' : x.load >= 8 ? '8–10' : '7–8') + ' g/kg, poca fibra y poca grasa. Ganar 1–2 kg de agua y glucógeno es lo esperado.');
  else if (x.raceToday) why.push('Día de prueba: desayuno 3 h antes, hidratos durante y recuperación después.');

/* ---------- progreso: peso medio semanal y ajuste propuesto ---------- */
E.nutriProgress = function (p, body, today, G, intake) {

async function initCloud() {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    const ref = db.doc('data/users/' + uid + '/estado');
    const snap = await ref.get();
    dbDoc = ref; syncMode = 'nube';
    initMealsCloud(ref);
    if (snap.exists) {
      const d = snap.data();
      let remote = null; try { remote = JSON.parse(d.json); } catch (e) { remote = null; }
      if (remote && (remote.updated || 0) >= (S.updated || 0)) { S = Object.assign(blank(), remote); try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { /* */ } render(); }

}

  const motor = E.motorState({ plan, adj: adj0, today: TODAY, isDone, done: S.done, raceDate: rA ? rA.fecha : p.fechaCarrera });
  const adj = S.motorOff ? adj0 : E.motorApply(adj0, plan, motor.dec, TODAY, p, plan.m);

function readyChanges(r) {

    if (isDone(s) || s.dropped || s.mode || s.kind === 'race') continue;
    let mode = r.action;

    else if (mode === 'suave' && !s.hard && s.min <= 45) continue;
    else if (mode === 'sin_impacto' && s.sport !== 'run' && s.sport !== 'multi') continue;
    out.push([s, mode]);

}

/* ----- registro de comidas: un documento por día (local + cuenta) ----- */
const ML_KEY = 'umbral_comidas_v1';
let MEALS = {};

let mealsCol = null;
const mealTimers = {};
function dayLog(d) { if (!MEALS[d]) MEALS[d] = { date: d, meals: {} }; if (!MEALS[d].meals) MEALS[d].meals = {}; return MEALS[d]; }
function persistMealsLocal() {
  const lim = E.addDays(TODAY, -180), out = {};

  try { localStorage.setItem(ML_KEY, JSON.stringify(out)); } catch (e) { /* sin almacenamiento */ }
}
function saveMeals(d) {
  dayLog(d).at = Date.now(); persistMealsLocal();
  if (!mealsCol) return;
  clearTimeout(mealTimers[d]);
  mealTimers[d] = setTimeout(() => { mealsCol.doc(d).set(JSON.parse(JSON.stringify(MEALS[d]))).catch(() => { toast('No se ha podido guardar en tu cuenta. Queda guardado en este navegador.'); }); }, 600);
}
async function initMealsCloud(ref) {
  try {
    mealsCol = ref.collection('comidas');
    const snap = await mealsCol.where('date', '>=', E.addDays(TODAY, -120)).get();
    for (const doc of snap.docs) {
      const d = doc.data(); if (!d || !d.date) continue;
      const loc = MEALS[d.date];
      if (!loc || (d.at || 0) >= (loc.at || 0)) MEALS[d.date] = JSON.parse(JSON.stringify(d));
    }
    for (const k in MEALS) if (k >= E.addDays(TODAY, -120) && !snap.docs.some(x => x.id === k) && MEALS[k].at) saveMeals(k);
    persistMealsLocal();
    if (UI.view === 'nutri' || UI.view === 'hoy') render();
  } catch (e) { mealsCol = null; }
}
function clearMeals() {

}
const slotItems = (d, k) => (dayLog(d).meals[k] || []);
const itemM = it => E.macrosOf(it.per100, it.g);
function eatenOf(d) { const L = MEALS[d]; if (!L) return { kcal: 0, p: 0, c: 0, f: 0 }; return E.sumM(Object.values(L.meals || {}).flat().map(itemM)); }

/* ----- objetivos del día (con semana, pruebas, afinamiento, estado y peso reciente) ----- */
function weightNow() {
  const ks = Object.keys(S.body || {}).filter(k => k <= TODAY && k > E.addDays(TODAY, -14) && +S.body[k].w).sort();
  if (!ks.length) return +C.p.peso;
  const last7 = ks.filter(k => k > E.addDays(TODAY, -7));
  const use = last7.length ? last7 : ks.slice(-3);
  return +(use.reduce((a, k) => a + +S.body[k].w, 0) / use.length).toFixed(1);
}
function nutriGate(d) {
  const ck = S.checkins && S.checkins[d]; if (!ck) return null;
  if (ck.enfermo && ck.enfermo !== 'no') return 'Hoy estás enfermo: comes a mantenimiento para recuperarte.';
  if (+ck.sueno && +ck.sueno < 6) return 'Menos de 6 h de sueño: hoy comes a mantenimiento.';
  const x = C.pmc.find(q => q.d === d);
  const rd = E.readiness(ck, C.p, x ? x.tsb : 0);
  if (rd.score < 55) return 'Tu estado de hoy es bajo (' + rd.score + '/100): hoy comes a mantenimiento.';
  return null;
}
function nutriWeekFor(date) {
  C.nw = C.nw || {};
  const mon = E.mondayOf(date);
  if (C.nw[mon]) return C.nw[mon];
  const races = C.races.map(r => Object.assign({}, r, { min: E.raceDurationFor(C.p, C.m, r) }));
  const phaseOf = d => { const w = C.plan.weeks.find(w => d >= w.mon && d <= E.addDays(w.mon, 6)); return w ? w.phase : null; };
  const days = [0, 1, 2, 3, 4, 5, 6].map(k => { const d = E.addDays(mon, k); return { date: d, sessions: activeOn(d) }; });
  C.nw[mon] = E.nutriWeek(nutriProfile(), C.m, days, { races, phaseOf, gate: nutriGate, W: weightNow(), adj: +S.nutriAdj || 0 });
  return C.nw[mon];
}
function nutriProfile() { return Object.assign({}, C.p, { objetivoNutri: C.p0.objetivoNutri, ritmo: C.p0.ritmo, pesoObjetivo: C.p0.pesoObjetivo, dieta: C.p0.dieta, alergias: C.p0.alergias, intolerancias: C.p0.intolerancias, evitar: C.p0.evitar, trazas: C.p0.trazas }); }

function slotsFor(d, t) {
  const sp = E.nutriSlots(nutriProfile(), t, activeOn(d));

  const custom = dayLog(d).custom || [];

  for (const k of Object.keys(log)) if (log[k] && log[k].length && !sp.slots.some(s => s.key === k)) sp.slots.splice(sp.slots.length - 1, 0, { key: k, name: SLOT_N[k] || k, time: null, target: { c: 0, p: 0, f: 0, kcal: 0 }, extra: true });

const fmtHHMM = m => m == null ? '' : String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(Math.round(m % 60)).padStart(2, '0');

/* ----- piezas visuales ----- */
function nxRing(label, val, tgt, color) {
  const R = 21, C2 = 2 * Math.PI * R, pct = tgt > 0 ? Math.min(1.35, val / tgt) : 0, done = tgt > 0 && val >= tgt * 0.9, over = tgt > 0 && val > tgt * 1.15;
  const dash = Math.min(1, pct) * C2, extra = pct > 1 ? Math.min(pct - 1, 0.35) * C2 : 0;
  return `<div class="nx-ring"><svg viewBox="0 0 52 52" width="52" height="52" role="img" aria-label="${esc(label)}: ${r0n(val)} de ${r0n(tgt)} g">
    <circle cx="26" cy="26" r="${R}" fill="none" stroke="var(--surface-3)" stroke-width="6"/>
    <circle cx="26" cy="26" r="${R}" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${dash} ${C2}" transform="rotate(-90 26 26)"/>
    ${extra ? `<circle cx="26" cy="26" r="${R}" fill="none" stroke="var(--bad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${extra} ${C2}" transform="rotate(-90 26 26)"/>` : ''}
    <text x="26" y="26" text-anchor="middle" dominant-baseline="central" font-family="var(--f-cond)" font-size="15" font-weight="600" fill="var(--ink)">${r0n(val)}</text></svg>
    <div class="v ${over ? 'over' : done ? 'ok' : ''}">de ${r0n(tgt)} g${done && !over ? ' ✓' : ''}</div><div class="l">${esc(label)}</div></div>`;
}
function nxBar(lbl, val, tgt, col, unit) {
  const pct = Math.min(100, tgt ? val / tgt * 100 : 0), over = tgt && val > tgt * 1.08;
  return `<div class="nx-mac"><div class="lbl"><span>${lbl}</span><span><b class="num">${nfk(val)}</b> <span class="muted">/ ${nfk(tgt)} ${unit || 'g'}</span>${over ? ` <span class="nx-over">+${nfk(val - tgt)}</span>` : ''}</span></div><div class="nx-bar"><i style="width:${pct}%;background:${col}"></i></div></div>`;
}
function nxProfile(d, sp) {
  const W = 520, H = 150, x0 = 6 * 60, x1 = 23 * 60, X = m => 12 + (Math.max(x0, Math.min(x1, m)) - x0) / (x1 - x0) * (W - 24), base = H - 24;
  const pts = [];
  for (const s of sp.slots) {
    if (s.time == null || s.extra) continue;
    const got = E.sumM(slotItems(d, s.key).map(itemM)).c;
    if (!s.target.c && !got) continue;
    pts.push({ tm: s.time, tgt: s.target.c, got });
  }
  if (!pts.length) return '';
  const maxC = Math.max(60, ...pts.map(p => Math.max(p.tgt, p.got)));
  const Y = c => base - c / maxC * (base - 18);
  const peak = (v, tm) => { const x = X(tm), w = 26; return `M${x - w},${base} C${x - w / 2},${base} ${x - 8},${Y(v)} ${x},${Y(v)} C${x + 8},${Y(v)} ${x + w / 2},${base} ${x + w},${base}`; };
  let g = '';
  if (sp.train) g += `<rect x="${X(sp.train.start)}" y="10" width="${Math.max(4, X(sp.train.start + sp.train.min) - X(sp.train.start))}" height="${base - 10}" fill="var(--pro)" opacity=".15" rx="3"/>`;
  g += `<line x1="12" x2="${W - 12}" y1="${base}" y2="${base}" stroke="var(--line)"/>`;
  for (const p of pts) {
    g += `<path d="${peak(p.tgt, p.tm)}" fill="none" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="4 3"/>`;
    if (p.got > 0) g += `<path d="${peak(p.got, p.tm)}Z" fill="var(--cho)" opacity=".85"/>`;
    g += `<text x="${X(p.tm)}" y="${Math.min(Y(Math.max(p.tgt, p.got)) - 5, base - 6)}" text-anchor="middle" font-size="11" fill="var(--muted)">${r0n(p.got)}/${r0n(p.tgt)}</text>`;
  }
  for (const h of [6, 9, 12, 15, 18, 21]) g += `<text x="${X(h * 60)}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--muted)">${h}h</text>`;
  return `<div class="nx-profile"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Hidratos por comida a lo largo del día" font-family="var(--f-cond)">${g}</svg>
    <div class="nx-legend"><span>Hidratos comidos (g)</span><span class="tgt">Objetivo</span>${sp.train ? '<span class="trn">Entreno</span>' : ''}</div></div>`;
}

const hm = m => fmtHHMM(((m % 1440) + 1440) % 1440);
function trainStartOf(d, sp, list) {
  const main = list.filter(x => x.sport !== 'str').sort((a, b) => b.min - a.min)[0];
  const rec = sp.slots.find(x => x.key === 'rec' && x.time != null);
  if (rec && main) return Math.round((rec.time - 30 - main.min) / 5) * 5;
  return { manana: 7.5 * 60, mediodia: 13 * 60, tarde: 18.5 * 60 }[(nutriProfile().horaEntreno) || 'tarde'] || 18.5 * 60;
}
function waterPlan(d, sp) {
  const w = weightNow() || 70, items = [], list = activeOn(d).filter(x => !x.dropped);
  const base = Math.round(35 * w / 50) * 50;
  const cardio = list.filter(x => x.sport !== 'str');
  const st0 = trainStartOf(d, sp, list);
  const cena = sp.slots.find(x => x.key === 'cena' && x.time != null);
  items.push({ t: 7 * 60, ml: 350, txt: 'Al levantarte. De noche pierdes casi medio litro respirando.' });
  items.push({ t: 9 * 60, ml: 300, txt: 'Con el desayuno.' });
  items.push({ t: 11.5 * 60, ml: 400, txt: 'Botella en la mesa: ve bebiendo a sorbos, no de golpe.' });
  items.push({ t: 14.5 * 60, ml: 350, txt: 'Con la comida.' });
  let cur = st0;
  cardio.forEach((s, i) => {
    const min = +s.min || 60, h = min / 60, sr = sweatRateFor(condOf(s)), rate = Math.round(sr.rate * 0.75 / 50) * 50;
    if (i === 0) items.push({ t: cur - 90, ml: 400, txt: '90 min antes de entrenar: da tiempo a orinar antes de salir.' });
    if (min >= 30) items.push({ t: cur + min / 2, ml: Math.round(rate * h / 50) * 50, txt: `Durante la sesión: ${rate} ml por hora, a sorbos cada 15 min${sr.measured ? ` (tu tasa medida es de ${sr.rate} ml/h)` : ''}.${min > 75 ? (sr.rate > 1200 ? ' Con 700-1.000 mg de sodio por litro.' : ' Con 500-700 mg de sodio por litro.') : ''}` });
    cur += min;
    if (i === cardio.length - 1) items.push({ t: cur + 15, ml: 500, txt: 'Al terminar. Si te pesas antes y después, bebe 1,5 litros por cada kilo perdido.' });
  });
  list.filter(x => x.sport === 'str').forEach(s => items.push({ t: st0 + (+s.min || 30) / 2, ml: 300, txt: 'Durante la fuerza.' }));
  items.push({ t: cena ? cena.time : 20.5 * 60, ml: 300, txt: 'Con la cena.' });
  items.push({ t: 22.5 * 60, ml: 150, txt: 'Poca cosa antes de dormir, para no levantarte de noche.' });
  items.sort((a, b) => a.t - b.t);
  return { items, target: Math.max(base, items.reduce((a, b) => a + b.ml, 0)), base };
}

function nxWeightChart(ks, G) {

/* ----- carrera: tasa de sudoración por condición (persistida, con histórico) ----- */
const COND = { run: 'Carrera', run_in: 'Cinta', bike: 'Bici exterior', bike_in: 'Rodillo', otro: 'Otro' };
const SWEAT_DEFAULT = { run: 900, run_in: 1100, bike: 800, bike_in: 1300, otro: 600 };
function condOf(s) {
  const t = (s.title || '').toLowerCase();
  if (s.sport === 'bike' || s.sport === 'multi') return /rodillo|indoor|virtual|zwift/.test(t) ? 'bike_in' : 'bike';
  if (s.sport === 'run') return /cinta|treadmill/.test(t) ? 'run_in' : 'run';
  return 'otro';
}
function sweatRecs(cond) { return Object.values(S.sweat || {}).filter(x => x.cond === cond && x.rate > 0).sort((a, b) => a.date < b.date ? 1 : -1); }
function sweatRateFor(cond) {
  const r = sweatRecs(cond).slice(0, 4);
  if (!r.length) return { rate: SWEAT_DEFAULT[cond] || 700, measured: false, n: 0 };
  return { rate: Math.round(r.reduce((a, b) => a + b.rate, 0) / r.length), measured: true, n: r.length };
}
function calcSweatRec(x) {
  const kg = (+x.before || 0) - (+x.after || 0), min = +x.min || 0;
  if (!min || !x.before || !x.after) return null;
  const loss = kg * 1000 + (+x.drank || 0) - (+x.pee || 0), rate = Math.round(loss / (min / 60));
  const pct = x.before ? kg / x.before * 100 : 0;
  return { rate, pct: Math.round(pct * 10) / 10, loss: Math.round(loss) };
}

/* ----- carrera: combustible (pre, durante y recuperación), con geles reales ----- */
const EVOLYTES_NA = 356; // mg de sodio por dosis (2,5 g del sin sabor o 5 g del que lleva sabor)
const GELS = {
  exo: { id: 'exolactate', name: 'ExoLactate', short: 'ExoLactate 68 g', g: 68, c: 40, na: 284, kcal: 171, ratio: '1:1', extra: '5 g de lactato, 100 mg de magnesio, pH neutro' },
  hf80: { id: 'g226_80', name: '226ers HF 80 g', short: '226ers 80 g', g: 80, c: 55, na: 250, kcal: 220, ratio: '10:8', extra: 'Ratio 1:0,8, sin gluten. Cereza y cola llevan cafeína' },
  hfxs: { id: 'g226_xs', name: '226ers HF XS 44 g', short: '226ers XS 44 g', g: 44, c: 30, na: 140, kcal: 120, ratio: '10:8', extra: 'Ratio 1:0,8. La versión cola lleva 55 mg de cafeína' }
};
function splitRatio(g, ratio) { const m = ratio === '2:1' ? Math.round(g * 2 / 3) : Math.round(g / 1.8); return { m, f: Math.max(0, Math.round(g) - m) }; }
function fuelSessions() {
  const d = UI.nutriDate || TODAY;
  const ss = activeOn(d).filter(s => s.sport !== 'str');
  return ss.length ? ss : [{ sport: UI.dk.manual.sport, min: UI.dk.manual.min, title: 'Sesión a medida', kind: '', manual: true }];
}
function fuelPlan() {
  const ss = fuelSessions(), s = ss[Math.min(UI.dk.ses, ss.length - 1)];
  const w = +C.p.peso || 70, min = +s.min || 60, h = min / 60, bidon = UI.dk.bidon || 500;
  const cond = condOf(s), sr = sweatRateFor(cond);
  const fluid = Math.round(sr.rate * 0.75 * h);
  const autoB = Math.max(1, Math.round(fluid / bidon));
  const bidones = Math.max(1, UI.dk.bidones || autoB);
  const sf = E.sessionFuel(s, C.p) || { chH: 0 };
  const gphDef = sf.chH || 0;
  const gph = UI.dk.gph != null ? UI.dk.gph : gphDef;
  const totalC = Math.round(gph * h);
  const gelSel = UI.dk.gelSel || {};
  const gelList = Object.entries(GELS).map(([key, g]) => ({ key, g, n: +gelSel[key] || 0 })).filter(x => x.n > 0);
  const gelUnits = gelList.reduce((a, x) => a + x.n, 0);
  const gelC = gelList.reduce((a, x) => a + x.n * x.g.c, 0);
  const gelNa = gelList.reduce((a, x) => a + x.n * x.g.na, 0);
  const powderC = Math.max(0, totalC - gelC);
  const perB = powderC / bidones;
  const concC = UI.dk.gelIn === 'bidon' ? (powderC + gelC) / bidones : perB;
  const conc = bidon > 0 ? concC / bidon * 100 : 0;
  const maxConc = s.sport === 'run' ? 8 : 10;
  const sp = splitRatio(powderC, UI.dk.ratio), spB = splitRatio(perB, UI.dk.ratio);
  const naPerL = sr.rate >= 1200 ? 850 : 600;
  const water = bidones * bidon;
  const naTotal = Math.round(naPerL * water / 1000);
  const doses = Math.max(0, Math.round(Math.max(0, naTotal - gelNa) / EVOLYTES_NA * 2) / 2);
  const gelEvery = gelUnits ? Math.round(min / gelUnits / 5) * 5 : 0;
  return { s, ss, w, min, h, sr, cond, fluid, water, bidon, bidones, autoB, gph, gphDef, totalC, gelList, gelUnits, gelC, gelNa, powderC, perB, concC, conc, maxConc, sp, spB, naPerL, naTotal, doses, gelEvery };
}
function preFuel(d) {

    txt: 'Entre 60 y 90 min antes. La comida de verdad, 2-3 h antes.' + ((long || hot) ? ' El sodio previo ayuda a retener líquido en sesiones largas o con calor.' : '') };
}

  return { c, cAuto, p, pAuto, ml, doses, sp: splitRatio(c, UI.dk.ratio), conc: ml > 0 ? c / ml * 100 : 0, rehyd,
    txt: `En los 30 min siguientes, ${c} g de hidratos y ${p} g de proteína.`,
    txt2: `Rehidratación estimada del día: unos ${rehyd} ml en las 2-3 h siguientes, o 1,5 litros por cada kilo perdido si te pesas. Si cenas en menos de 45 min, sáltate el batido y cena.` };
}

/* ----- plan de carrera: qué tomar y cuándo, por segmentos ----- */
function racePlanCard() {
  const list = C.upcoming.length ? C.upcoming : C.races.slice(-1);
  const race = list.find(x => x.id === UI.raceNutriId) || list.find(x => x.prioridad === 'A') || list[0];
  if (!race) return '';
  const rp = UI.rp, bid = UI.dk.bidon || 500;
  const gels = Object.entries(GELS).filter(([k]) => rp.gels[k]).map(([k, g]) => ({ key: k, name: g.name, c: g.c, na: g.na }));
  const plan = E.racePlan(C.p, C.m, race, { gph: rp.gph, gels, bidon: bid, powder: rp.powder, ratio: UI.dk.ratio, sweat: { bike: sweatRateFor('bike').rate, run: sweatRateFor('run').rate }, maxConc: 9 });
  const hmm = t => { const x = Math.round(t); return Math.floor(x / 60) + ':' + String(x % 60).padStart(2, '0'); };
  const head = `<div class="card-h"><h2>Plan de carrera: qué tomar y cuándo</h2>${plan.ok ? `<span class="pill dark">${E.fmtHM(plan.T)} h</span>` : ''}</div>
    ${list.length > 1 ? `<div class="field" style="margin-bottom:12px"><label for="race-sel2">Prueba</label><select id="race-sel2" data-racesel="1">${list.map(x => `<option value="${esc(x.id)}" ${x.id === race.id ? 'selected' : ''}>${esc(x.prioridad + ' · ' + x.nombre + ' · ' + E.fmtFechaC(x.fecha))}</option>`).join('')}</select></div>` : `<p class="muted" style="font-size:13.5px;margin-bottom:10px">${esc(race.nombre)} · ${esc(E.fmtFechaC(race.fecha))}</p>`}`;
  if (!plan.ok) return `<section class="card" id="race-plan">${head}<p>${esc(plan.reason)}</p></section>`;
  const T = plan.totals;
  const ctl = `<div class="stack" style="gap:10px;margin:4px 0 14px">
    <div class="row sb" style="font-size:14px"><span>Hidratos por hora</span><span class="row" style="gap:6px"><button type="button" class="chip" data-act="nx-rpGph" data-v="-5" aria-label="Bajar">−</button><b style="min-width:64px;text-align:center" class="num">${plan.gph} g/h</b><button type="button" class="chip" data-act="nx-rpGph" data-v="5" aria-label="Subir">+</button></span></div>
    <div class="row" style="gap:8px;flex-wrap:wrap;align-items:center;font-size:14px"><span class="muted">Geles que llevas</span>${Object.entries(GELS).map(([k, g]) => `<button type="button" class="chip" data-act="nx-rpGel" data-g="${k}" aria-pressed="${!!rp.gels[k]}">${esc(g.short)}</button>`).join('')}</div>
    <div class="row" style="gap:8px;flex-wrap:wrap;align-items:center;font-size:14px"><span class="muted">En bici</span><button type="button" class="chip" data-act="nx-rpPowder" aria-pressed="${rp.powder}">Hidratos en el bidón</button>${[500, 750].map(v => `<button type="button" class="chip" data-act="nx-rpBid" data-v="${v}" aria-pressed="${bid === v}">Bidón de ${v} ml</button>`).join('')}</div></div>`;
  if (plan.legsOnly) return `<section class="card" id="race-plan">${head}<p>${plan.notes.map(esc).join(' ')}</p></section>`;
  const gelTxt = Object.entries(T.gelUnits).map(([k, n]) => `${n} × ${GELS[k].name}`).join(' · ');
  const summ = `<div class="row" style="gap:20px;flex-wrap:wrap;margin-bottom:12px">
    <div class="stat"><b class="num">${T.carbs}</b><span>g de hidratos</span></div><div class="stat"><b class="num">${T.gels}</b><span>geles</span></div>${T.bidones ? `<div class="stat"><b class="num">${T.bidones}</b><span>bidones de ${bid} ml</span></div>` : ''}<div class="stat"><b class="num">${nf(T.fluid / 1000, 1)}</b><span>L de líquido</span></div></div>
    <p class="nx-small" style="margin:0 0 6px"><b>Lista de la compra para ese día:</b> ${gelTxt || 'sin geles'}${T.bidones ? `. Para los bidones: ${T.m} g de maltodextrina, ${T.f} g de fructosa y ${nf(T.doses, 1)} dosis de Evolytes` : ''}.</p>
    <p class="nx-small muted" style="margin:0 0 12px">Calculado sobre ${plan.goalBased ? 'tu tiempo objetivo' : 'tu tiempo estimado'} de ${E.fmtHM(plan.T)} h. El agua sale de tu tasa de sudoración (${sweatRateFor('bike').measured || sweatRateFor('run').measured ? 'medida' : 'estimada: mídela en esta pestaña para afinarla'}) al 75 %.</p>`;
  const segs = plan.segs.map(sg => {
    if (!sg.events || !sg.events.length) return '';
    const sub = sg.sport === 'swim' || sg.sport === 'trans' ? '' : `<span class="muted nx-small">${E.fmtHM(sg.min)} h · ${sg.carbsH} g/h · ${sg.carbs} g en total</span>`;
    return `<div class="nx-block" style="margin-top:10px"><div class="row sb"><h3 class="nx-h3" style="margin:0">${esc(sg.label)}</h3>${sub}</div>
      ${sg.events.map(ev => `<div class="row nx-small" style="gap:12px;align-items:flex-start;border-top:1px solid var(--line);padding:7px 0"><b class="num" style="min-width:44px">${hmm(ev.t)}</b><span class="muted num" style="min-width:48px">${ev.km != null ? 'km ' + nf(ev.km, ev.km < 10 ? 1 : 0) : ''}</span><span>${esc(ev.txt)}</span></div>`).join('')}</div>`;
  }).join('');
  return `<section class="card" id="race-plan">${head}${ctl}${summ}${segs}
    <ul class="nx-small muted" style="margin:12px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px">${plan.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul></section>`;
}

function closeSheet() { const el = document.getElementById('sheet'); if (el) el.innerHTML = ''; UI.sheet = null; }
function allFoods() { return Object.values(S.foods || {}).map(f => Object.assign({ custom: true }, f)).concat(Object.values(E.FOODDB)); }
function recentFoods() {
  const seen = new Map();
  for (let i = 0; i < 21; i++) { const L = MEALS[E.addDays(TODAY, -i)]; if (!L) continue; for (const it of Object.values(L.meals || {}).flat()) if (it.fid && !seen.has(it.fid)) seen.set(it.fid, it); }
  return [...seen.values()].slice(0, 12).map(it => E.foodOf(it.fid, S.foods) || { id: it.fid, name: it.name, per100: it.per100, tags: it.tags || [] });
}
function foodList(q) {
  const R = restr(), n = (q || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const src = n ? allFoods().filter(f => (f.name + ' ' + (f.brand || '')).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').includes(n)) : recentFoods().concat(Object.values(S.foods || {})).concat(Object.values(E.FOODDB));
  const uniq = []; const ids = new Set();

// busca el código tal cual y en sus variantes (UPC-A de 12 cifras ↔ EAN-13 con un 0 delante)
async function offLookup(code) {

  if (code.length === 13 && code[0] === '0') cands.push(code.slice(1));
  let net = false;

    const r = await offFetch('https://world.openfoodfacts.org/api/v2/product/' + encodeURIComponent(c) + '.json?fields=' + OFF_FIELDS);
    if (r.net) { net = true; continue; }

    if (parsed) return { data: parsed };

}

const clock = x => { if (x == null || !isFinite(x)) return '—'; const t = Math.round(x), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), sc = t % 60; return h ? h + ':' + String(m).padStart(2, '0') + ':' + String(sc).padStart(2, '0') : m + ':' + String(sc).padStart(2, '0'); };

function md(t) {
  const lines = esc(t).split('\n');
  let html = '', inList = false, para = [];
  const flush = () => { if (para.length) { html += '<p>' + para.join('<br>') + '</p>'; para = []; } };
  for (const raw of lines) {
    const l = raw.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    if (/^\s*([-•*]|\d+\.)\s+/.test(l)) { flush(); if (!inList) { html += '<ul>'; inList = true; } html += '<li>' + l.replace(/^\s*([-•*]|\d+\.)\s+/, '') + '</li>'; continue; }
    if (inList) { html += '</ul>'; inList = false; }
    if (!l.trim()) { flush(); continue; }
    para.push(l.replace(/^#+\s*/, ''));
  }
  flush(); if (inList) html += '</ul>';
  return html;
}

async function sendChat(text) {
  text = (text || '').trim();
  if (!text || UI.busy) return;
  if (!sampleFn) { UI.coachOff = 'El coach no está disponible en esta vista.'; render(); return; }
  S.chat.push({ role: 'user', content: text });
  UI.busy = true; UI.stream = ''; UI.acts = []; UI.draft = '';
  render(); scrollChat();
  const ctl = new AbortController(); UI.ctl = ctl;
  const hist = S.chat.filter(mg => !mg.sys).slice(-16).map(mg => ({ role: mg.role, content: mg.content }));
  while (hist.length && hist[0].role !== 'user') hist.shift();
  const turns = [{ role: 'user', content: coachRules() }].concat(hist);
  const opts = { signal: ctl.signal, onText: ({ text: t }) => { UI.stream = t; const el = document.getElementById('stream'); if (el) { el.innerHTML = md(t); scrollChat(); } } };
  try {
    const lim = await sampleFn.limits().catch(() => null);
    if (lim && lim.tools) opts.tools = coachTools(); else opts.cache = false;
    const r = await sampleFn(turns, opts);
    S.chat.push({ role: 'assistant', content: r.text + (r.truncated ? '\n\n(Respuesta cortada: pídemelo por partes.)' : ''), acts: UI.acts.slice() });
  } catch (e) {
    const code = e && e.code;
    if (code === 'cancelled') { if (e.text) S.chat.push({ role: 'assistant', content: e.text + '\n\n(Interrumpido)', acts: UI.acts.slice() }); }
    else if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(code)) { UI.coachOff = 'No hay permiso para que el coach use Claude en esta página. El resto de la app sigue funcionando.'; S.chat.pop(); }
    else if (code === 'rate_limited') S.chat.push({ role: 'assistant', content: (e.text ? e.text + '\n\n' : '') + 'He llegado al límite de uso por ahora. Vuelve a intentarlo en unos minutos.', sys: true });
    else if (code === 'session_expired') S.chat.push({ role: 'assistant', content: 'Tu sesión ha caducado. Vuelve a iniciar sesión en Claude y repite la pregunta.', sys: true });
    else S.chat.push({ role: 'assistant', content: (e && e.text ? e.text + '\n\n' : '') + 'No he podido terminar la respuesta. Inténtalo otra vez.', sys: true, acts: UI.acts.slice() });
  }

  S.chat = S.chat.slice(-40); save(); compute(); render(); scrollChat();

function csvParseLines(text) {
  const rows = []; let row = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += c;
    } else if (c === '"') inQ = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(field); field = '';
      if (row.length > 1 || row[0] !== '') rows.push(row);
      row = [];
    } else field += c;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows;
}
function findCol(headers, patterns) {
  for (const re of patterns) { const i = headers.findIndex(h => re.test(h)); if (i >= 0) return i; }
  return -1;
}
function mapActivityType(t) {
  t = String(t || '').toLowerCase();
  if (/nata|swim/.test(t)) return 'swim';
  if (/triat|duat|multi/.test(t)) return 'multi';
  if (/bici|cicl|cycl|bike|mtb|gravel/.test(t)) return 'bike';
  if (/correr|carrera a pie|running|^run\b|trail/.test(t)) return 'run';
  if (/fuerza|strength|gimnasio|pesas|weight/.test(t)) return 'str';
  return null;
}
function parseCsvDate(str) {
  str = String(str || '').trim(); if (!str) return null;
  let m = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return `${m[3]}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`;
  const d = new Date(str);
  if (!isNaN(d)) return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  return null;
}
function parseDuration(str) {
  const parts = String(str || '').trim().split(':').map(Number);
  if (!parts.length || parts.some(isNaN)) return null;
  let sec = 0;
  if (parts.length === 3) sec = parts[0] * 3600 + parts[1] * 60 + parts[2];
  else if (parts.length === 2) sec = parts[0] * 60 + parts[1];
  else sec = parts[0];
  return sec > 0 ? Math.max(1, Math.round(sec / 60)) : null;
}
function estimateImport(sport, min, avgHR, nativeTss, matched) {
  let tss, ifEst;
  if (nativeTss && nativeTss > 0) { tss = Math.round(nativeTss); ifEst = min > 0 ? Math.sqrt(tss / (min / 60 * 100)) : 0.7; }
  else if (matched) { const ratio = matched.min ? min / matched.min : 1; tss = sport === 'str' ? Math.round(min * 0.5) : Math.max(1, Math.round(matched.tss * ratio)); ifEst = matched.IF || 0.7; }
  else if (sport === 'str') { tss = Math.round(min * 0.5); ifEst = 0.7; }
  else if (avgHR && (C.m.lthrRun || C.m.lthrBike)) {
    const lthr = sport === 'run' ? C.m.lthrRun : sport === 'bike' ? C.m.lthrBike : (C.m.lthrRun || C.m.lthrBike);
    ifEst = Math.min(1.15, Math.max(0.4, avgHR / lthr)); tss = Math.round(min / 60 * ifEst ** 2 * 100);
  } else { ifEst = 0.65; tss = Math.round(min / 60 * ifEst ** 2 * 100); }

}

function handleImportFile(file) {

function placeTip(ev) { const w = tip.offsetWidth, h = tip.offsetHeight; let x = ev.clientX + 14, y = ev.clientY + 14; if (x + w > innerWidth - 8) x = ev.clientX - w - 14; if (y + h > innerHeight - 8) y = ev.clientY - h - 14; tip.style.left = x + 'px'; tip.style.top = y + 'px'; }
document.addEventListener('pointerleave', () => { tip.hidden = true; });
let rz = null; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(drawCharts, 120); });
